function jotformId(link){
 try{
  const u=new URL(String(link||'').trim());
  const host=u.hostname.toLowerCase();
  if(u.protocol!=='https:' || !(host==='jotform.com'||host.endsWith('.jotform.com')))return '';
  // Published Jotform links can include a username or /form/ path before the form ID.
  const parts=u.pathname.split('/').filter(Boolean);
  return parts.find(p=>/^\d{10,22}$/.test(p))||'';
 }catch{return ''}
}

 if(email && rosterState.players.some(p=>(p.email||'').toLowerCase().trim()===email))return 'review';
 if(rosterState.players.some(p=>(p.name||'').toLowerCase().trim()===row.name.toLowerCase().trim()))return 'review';

  const previousEmail=String(previous.email||'').trim().toLowerCase();

   if(prior){
    if(prior.teamId!==selectedTeam.id)return alert(label+' already belongs to another team in this event. Change that assignment manually in Player Directory before importing.');
    alreadyCount++;continue;
   }
   nextAssignments.push({eventKey:S.title,playerId:id,teamId:selectedTeam.id,captain:!!r.isCaptain});changes++;
  }
  const created=nextPlayers.length-rosterState.players.length;
  if(!changes&&!created)return alert('No changes to save. All selected players are already assigned or skipped.');
  if(!confirm(`Save ${changes} new team assignment(s) and ${created} new name-only profile(s)? ${alreadyCount} already-assigned player(s) will remain unchanged. Waivers and competition data are not affected.`))return;
  const btn=d.querySelector('#riSave');btn.disabled=true;btn.textContent='Saving…';
  if(await directorySave(nextPlayers,nextAssignments)){
   d.remove();alert(`Roster saved: ${changes} assignment(s), ${created} new profile(s), ${alreadyCount} already on team. Refresh this preview to review future changes.`);
  }else{btn.disabled=false;btn.textContent='Review & save selected roster';}
 };
}

 if(!hqCanScoreSelected() || !m || !Array.isArray(sets)){
  alert('Select an active LIVE tournament with director access before submitting a score.');return false;
 }
 const id=hqInspectedId, matchId=m.id;
 hqScoringBusy=true;
 try{
  const {data:fresh,error:freshError}=await client.rpc('hq_multi_view',{p_event_id:id});
  if(freshError)throw freshError;
  if(hqInspectedId!==id || fresh?.data?.eventId!==id || fresh.data.status!=='live')throw Error('Event changed or is no longer live.');
  const current=fresh.data.matches?.find(x=>x.id===matchId);
  if(!current || current.home!==m.home || current.away!==m.away || !['scheduled','final'].includes(current.status))
   throw Error('Match changed since it was displayed. Reload before resubmitting.');
  const correction=current.status==='final';
  if(correction){
   if(current.forfeitWinner || current.stage==='pool'&&fresh.data.matches.some(x=>x.stage==='playoff'))
    throw Error('Correction requires manual reconciliation.');
   const revised={...current,sets};
   if(winner(revised)!==winner(current))throw Error('Winner-changing correction requires bracket reconciliation.');
   if(hqSameJSON(current.sets,sets))throw Error('No score change entered.');
  }
  const {data:receipt,error}=await client.rpc(
   correction?'hq_multi_director_correction_submit':'hq_multi_director_submit',
   {p_event_id:id,p_match:matchId,p_sets:sets,p_home:m.home,p_away:m.away}
  );
  if(error)throw error;
  hqSelectedMessage='Cloud accepted '+(correction?'correction':'score')+' report '+receipt+'. Awaiting director review.';
  await hqRefreshSelectedPending();
  if(hqPendingError)hqSelectedMessage+=' Queue refresh unavailable: '+hqPendingError+'; do NOT resubmit blindly.';
  return true;
 }catch(e){
  hqSelectedMessage='Score NOT confirmed: '+(e?.message||String(e))+' — reload before retrying.';
  alert(hqSelectedMessage);return false;
 }finally{hqScoringBusy=false;render();}
}
// Same approval buttons, but a full fresh read and event-specific RPC.
// Bracket progression is automatically reconciled AFTER successful approval.
async function hqApproveSelectedReport(reportId,approve){
 if(!hqCanApproveSelected())return alert('Score review is only available on a live event for authorized staff.');
 const id=hqInspectedId;
 hqScoringBusy=true;hqSelectedMessage='Refreshing event and pending report…';render();
 try{
  const [view,pendingResp]=await Promise.all([
    client.rpc('hq_multi_view',{p_event_id:id}),
    client.rpc('hq_multi_pending',{p_event_id:id})
  ]);
  if(view.error)throw view.error;
  if(pendingResp.error)throw pendingResp.error;
  const raw=view.data?.data,version=Number(view.data?.version);
  if(hqInspectedId!==id || raw?.eventId!==id || raw?.status!=='live' || !Number.isSafeInteger(version))
   throw Error('Selected event or version changed. No approval sent.');
  const r=hqNormalizePending(pendingResp.data).find(x=>String(x.id)===String(reportId));
  if(!r)throw Error('Report no longer pending. Nothing submitted.');
  const m=raw.matches?.find(x=>x.id===r.matchId);
  if(!m || m.home!==r.home || m.away!==r.away)throw Error('Match participants changed. Resolve report manually.');
  if(approve){
   if(m.status!=='scheduled' || (m.sets||[]).length || m.forfeitWinner)
    throw Error('Match already final or altered. Correction approval needs a separate safety review.');
   const validation=validSets(r.sets,m);
   if(validation)throw Error('Invalid score: '+validation);
   if(m.stage==='pool' && raw.matches.some(x=>x.stage==='playoff'))
    throw Error('Pool scoring closed after bracket creation.');
  }
  if(!confirm((approve?'Approve':'Reject')+' report for '+team(m.home)+' vs '+team(m.away)+' in '+hqEventPreview.title+'?')){
   hqSelectedMessage='Review cancelled; cloud unchanged.';return;
  }
  let candidate=null;
  if(approve){
   candidate=copy(raw);
   const target=candidate.matches.find(x=>x.id===m.id);
   target.sets=copy(r.sets);target.status='final';
  }
  const {error}=await client.rpc('hq_multi_decide',{
    p_event_id:id,p_report:r.id,p_approve:approve,p_data:candidate,p_expected:version
  });
  if(error)throw error;
  hqSelectedMessage=(approve?'Approval':'Rejection')+' submitted. Reloading authoritative cloud state…';
  const {data:verified,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
  if(readError)throw readError;
  if(verified?.data?.eventId!==id || Number(verified.version)<=version)
   throw Error('Change sent, but verification incomplete. Reload before further action; do not repeat the decision.');
  if(hqInspectedId===id){
   hqEventPreview={...hqEventPreview,raw:verified,error:null};
   S=hqSafeDisplayState(verified.data,hqEventPreview.title,verified.version);
   await hqRefreshSelectedPending();
   hqSelectedMessage=(approve?'Score approved':'Report rejected')+' · cloud version '+verified.version;
   if(approve && m.stage==='playoff'){
    // Approval already committed. Apply progression automatically with fresh
    // cloud reads; any interruption is reconciled on the next event load.
    const outcome=await hqReconcileApprovedPlayoffs(id);
    if(!outcome.error && !outcome.advanced && hqInspectedId===id)
     hqSelectedMessage='Playoff score approved; bracket already current or championship final.';
   }
  }
 }catch(e){
  if(hqInspectedId===id)hqSelectedMessage='Review NOT confirmed: '+(e?.message||String(e))+' — refresh before retrying.';
 }finally{hqScoringBusy=false;render();}
}
// N4-H Flight 90: one original approval flow with automatic advancement.
// N4-H Flight 89: finalize score first, then independently advance its winner.
// Never mutate local brackets or retry a score approval to recover advancement.
async function hqAdvanceApprovedPlayoff(matchId){
 const id=hqInspectedId;
 if(!hqViewingSelected() || mode!=='director' || cloudRole!=='director' ||
    !client || !session || !id || id==='legacy')
  throw Error('Director access to a selected event is required.');
 const {data:before,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
 if(readError)throw readError;
 const data=before?.data,version=Number(before?.version);
 if(hqInspectedId!==id || data?.eventId!==id || data.status!=='live' ||
    !Number.isSafeInteger(version) || !Array.isArray(data.matches))
  throw Error('Event changed or is not live. Refresh before retrying.');
 const match=data.matches.find(x=>x.id===matchId);
 if(!match || match.stage!=='playoff' || match.status!=='final' || !Array.isArray(match.sets))
  throw Error('A finalized playoff score is required.');
 const win=winner(match);
 if(!win)throw Error('Finalized playoff result has no valid winner.');
 const target=data.matches.find(x=>x.stage==='playoff' &&
   Number(x.round)===Number(match.round)+1 &&
   Number(x.index)===Math.floor(Number(match.index)/2));
 if(!target)return {result:'final',version};
 const side=Number(match.index)%2===0?'home':'away';
 if(target[side]===win)return {result:'already',version};
 if(target[side]!=null && target[side]!=='' || target.started || target.status==='final' ||
    (Array.isArray(target.sets)&&target.sets.length))
  throw Error('Downstream match contains conflicting or started data; director review required.');
 const {data:next,error:rpcError}=await client.rpc('hq_multi_bracket_advance',{
  p_event_id:id,p_match_id:matchId,p_expected:version
 });
 if(rpcError)throw Error('Advancement not confirmed: '+rpcError.message);
 const {data:after,error:checkError}=await client.rpc('hq_multi_view',{p_event_id:id});
 if(checkError)throw Error('Advancement sent but cloud verification failed. Reload before retrying.');
 const actual=after?.data?.matches?.find(x=>x.id===target.id);
 if(hqInspectedId!==id || after?.data?.eventId!==id ||
    Number(after.version)!==Number(next) || actual?.[side]!==win ||
    !hqSameJSON(after.data.matches.find(x=>x.id===matchId),match))
  throw Error('Advancement response could not be verified. Reload before retrying.');
 if(hqInspectedId===id){
  hqEventPreview={...hqEventPreview,raw:after,error:null};
  S=hqSafeDisplayState(after.data,hqEventPreview.title,after.version);
 }
 return {result:'advanced',version:Number(after.version),winner:win};
}
// N4-H Flight 90: reconcile persisted, approved playoff results automatically.
// This is the original director workflow: approval -> advancement; no repair button.
// An interrupted approval cannot be repeated to advance a winner.
let hqAdvancementSyncBusy=false;
async function hqReconcileApprovedPlayoffs(eventId){
 if(hqAdvancementSyncBusy || hqSelectedSaving || !hqViewingSelected() ||
    mode!=='director' || cloudRole!=='director' || !client || !session ||
    !eventId || hqInspectedId!==eventId || S.status!=='live')
  return {advanced:0,skipped:true};
 hqAdvancementSyncBusy=true;
 let advanced=0;
 try{
  // Each iteration starts from the authoritative result loaded by the last RPC.
  // Maximum 31 is above our backend's bracket limit. Never alter scores.
  for(let i=0;i<31;i++){
   if(hqInspectedId!==eventId || S.status!=='live')break;
   const source=S.matches.find(m=>{
    if(m.stage!=='playoff' || m.status!=='final' || !winner(m) || m.slot==='BYE')return false;
    const target=S.matches.find(t=>t.stage==='playoff' &&
      Number(t.round)===Number(m.round)+1 &&
      Number(t.index)===Math.floor(Number(m.index)/2));
    return !!target && target[Number(m.index)%2===0?'home':'away']!==winner(m);
   });
   if(!source)break;
   const outcome=await hqAdvanceApprovedPlayoff(source.id);
   if(outcome.result==='advanced')advanced++;
   else if(outcome.result==='already'){
    // Another director may have advanced it; reload the authoritative state.
    const {data,error}=await client.rpc('hq_multi_view',{p_event_id:eventId});
    if(error)throw error;
    if(hqInspectedId!==eventId || data?.data?.eventId!==eventId)break;
    hqEventPreview={...hqEventPreview,raw:data,error:null};
    S=hqSafeDisplayState(data.data,hqEventPreview.title,data.version);
   }else throw Error('A semifinal could not be mapped to its next match.');
  }
  if(advanced && hqInspectedId===eventId)
   hqSelectedMessage=advanced+' approved playoff winner'+(advanced===1?'':'s')+
     ' automatically advanced. Existing scores were preserved.';
  return {advanced,skipped:false};
 }catch(e){
  // Approval is already committed; NEVER request another score submission.
  if(hqInspectedId===eventId)
   hqSelectedMessage='Approved scores are saved. Bracket advancement needs review: '+
    (e?.message||String(e))+'. Do not resubmit or reapprove scores.';
  return {advanced,error:e?.message||String(e)};
 }finally{
  hqAdvancementSyncBusy=false;
  if(hqInspectedId===eventId)render();
 }
}

async function hqCommitSelectedMetadata(operation=tab){
 const p=hqEventPreview,id=hqInspectedId,raw=p?.raw?.data;
 const fail=message=>{if(hqInspectedId===id&&raw){S=hqSafeDisplayState(raw,p.title,p.raw.version);hqSelectedMessage=message;render();}};
 if(!hqCanEditSelectedMetadata() || !['sponsors','assignments','refs'].includes(operation)){
  fail('Changes are unavailable for this tournament or lifecycle. No cloud data changed.');return false;
 }
 const expected=Number(p.raw.version),candidate=copy(raw);
 // Explicitly restrict the original handlers to metadata, and refuse all other
 // shared-state changes, including match, team, scoring, or lifecycle changes.
 const baseline=hqSafeDisplayState(raw,p.title,expected);
 if((operation!=='assignments' && (!hqSameJSON(S.matches,baseline.matches) || !hqSameJSON(S.teams,baseline.teams)))
   || !hqSameJSON(S.courts,baseline.courts) || S.status!==baseline.status){
   fail('A structural change was blocked: use an authorized event-specific workflow.');return false;
 }
 if(operation==='sponsors'){
   candidate.sponsors=copy(S.sponsors||[]);
   candidate.sponsorDisplay=S.sponsorDisplay||'strip';
 }else if(operation==='refs'){
   candidate.refs=copy(S.refs||[]);
 }else if(operation==='assignments'){
   const unchangedTeam=t=>{const result=copy(t);delete result.crewCapacity;return result};
   if(!Array.isArray(S.matches)||S.matches.length!==baseline.matches.length ||
      !Array.isArray(S.teams)||S.teams.length!==baseline.teams.length ||
      S.teams.some((t,i)=>!hqSameJSON(unchangedTeam(t),unchangedTeam(baseline.teams[i])))){
     fail('Only crew-capacity adjustments are permitted for teams on this page.');return false;
   }
   for(let i=0;i<S.matches.length;i++){
     const changed=S.matches[i],original=baseline.matches[i];
     if(!original || changed.id!==original.id){fail('Match ordering or identity changed; save blocked.');return false;}
     const strip=m=>{const x=copy(m);delete x.official;delete x.lineTeam;return x};
     if(!hqSameJSON(strip(changed),strip(original))){
       fail('Match results, participants, scheduling and status cannot change through Officials.');return false;
     }
     if((isDone(original)||original.started) &&
         (changed.official!==original.official||changed.lineTeam!==original.lineTeam)){
       fail('Officials for completed or started matches are protected.');return false;
     }
   }
   const permitted=new Set(['crewCapacity','bracketOfficialMode','bracketLineMode']);
   const clean=x=>Object.fromEntries(Object.entries(x||{}).filter(([k])=>!permitted.has(k)));
   if(!hqSameJSON(clean(S.settings),clean(baseline.settings))){
     fail('Competition rules changed outside authorized staffing fields.');return false;
   }
   candidate.matches=copy(S.matches);
   candidate.teams=copy(S.teams);
   candidate.settings={...(raw.settings||{})};
   for(const k of permitted)if(S.settings[k]!==undefined)candidate.settings[k]=copy(S.settings[k]);
   const previousErrors=new Set((()=>{const held=S;try{S=baseline;return validate().filter(x=>x.level==='error').map(x=>x.msg)}finally{S=held}})());
   const newErrors=validate().filter(x=>x.level==='error').map(x=>x.msg).filter(x=>!previousErrors.has(x));
   if(newErrors.length){fail('Staffing change introduces a scheduling conflict: '+newErrors.slice(0,2).join(' · '));return false;}
 }else{
   fail('This workflow has not been connected to event-specific cloud saving. No changes were sent.');return false;
 }
 if(operation!=='assignments'&&!hqSameJSON(S.settings,baseline.settings)){
   fail('Unapproved competition settings changes were blocked.');return false;
 }
 if(hqSameJSON(candidate,raw)){
   hqSelectedMessage='No metadata changes to save.';render();return true;
 }
 hqSelectedSaving=true;hqSelectedMessage='Checking event-specific metadata before saving…';render();
 let sent=false;
 try{
  const {data:fresh,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
  if(readError)throw readError;
  if(id!==hqInspectedId || fresh?.data?.schema!==2 || fresh.data.eventId!==id
   || Number(fresh.version)!==expected || !hqSameJSON(fresh.data,raw))
   throw Error('Event data changed. Refresh the selected tournament and retry.');
  if(!confirm('Save '+(operation==='sponsors'?'sponsor information':operation==='assignments'?'official assignments':'referee names')+' for '+p.title+' only?\n\nNo match results or tournament lifecycle will be changed.')){
   fail('Metadata change cancelled. No cloud data changed.');return false;
  }
  sent=true;
  const {error}=await client.rpc('hq_multi_save',{p_event_id:id,p_data:candidate,p_expected:expected});
  if(error)throw error;
  const {data:verified,error:verifyError}=await client.rpc('hq_multi_view',{p_event_id:id});
  if(verifyError)throw verifyError;
  const metadataSame=operation==='sponsors'
   ? hqSameJSON(verified?.data?.sponsors,candidate.sponsors)&&verified?.data?.sponsorDisplay===candidate.sponsorDisplay
   : operation==='assignments'
     ? hqSameJSON(verified?.data?.matches,candidate.matches)&&hqSameJSON(verified?.data?.teams,candidate.teams)
       && ['crewCapacity','bracketOfficialMode','bracketLineMode'].every(k=>verified?.data?.settings?.[k]===candidate.settings[k])
     : hqSameJSON(verified?.data?.refs,candidate.refs);
  if(verified?.data?.eventId!==id || Number(verified.version)<=expected
   || !metadataSame || (operation!=='assignments' && !hqSameJSON(verified.data.matches,raw.matches))
   || (operation==='assignments' && (!hqSameJSON(verified.data.matches,candidate.matches) || !hqSameJSON(verified.data.settings,candidate.settings)))
   || !hqSameJSON(verified.data.teams,candidate.teams)
   || verified.data.status!==raw.status)
   throw Error('Cloud response needs manual verification; reselect event before retrying.');
  if(hqInspectedId===id){
   hqEventPreview={...p,raw:verified,error:null};
   S=hqSafeDisplayState(verified.data,p.title,verified.version);
   hqSelectedMessage='Event metadata saved and verified · cloud version '+verified.version;
  }
  return true;
 }catch(e){
  fail((sent?'Save NOT confirmed: ':'Change NOT saved: ')+(e?.message||String(e))+
    ' The backend may disallow metadata changes after publication. Reselect the event before retrying.');
  return false;
 }finally{hqSelectedSaving=false;render();}
}

// Capture phase stops original non-setup handlers before they can touch
// the legacy cloud, localStorage or independent event data.
for(const eventName of ['click','change','submit','input']){

   if(!hqViewingSelected())return;
   const target=event.target;
   if(!(target instanceof Element)||!target.closest('#root'))return;
   const isNav=target.closest('[data-group],nav.tabs [data-tab],nav.subtabs [data-tab]');
   const isEventSelector=target.closest('#hqEventSelector,#hqEventRefresh,#hqNewEvent,.hq-event-bar');
   if(isEventSelector && !hqSelectedSaving)return;

   const actionable=target.closest('button,input,select,textarea,[contenteditable],a,[role="button"]')||target;
   if(hqSetupEditableElement(actionable))return;
   if(target.closest('button,input,select,textarea,form,a,[contenteditable],summary,[role="button"]')){
     event.preventDefault();event.stopImmediatePropagation();
   }
 },true);

 const permittedSettings=['count','courts','start','end','minutes','breakMinutes','rest','postPoolBreak',
   'preferredBracketStart','poolRepeats','poolTarget','poolCap','playoffTarget','playoffDecider',
   'playoffCap','playoffMinutes','setsToWin','playoff','officialMode','lineMode'];
 const candidate=copy(raw);
 candidate.settings={...(raw.settings||{})};
 for(const k of permittedSettings)if(S.settings[k]!==undefined)candidate.settings[k]=copy(S.settings[k]);
 candidate.teams=copy(S.teams);
 candidate.courts=copy(S.courts);
 candidate.title=S.title;
 // Setup edits must not manufacture match records or reports, or change stage.
 if(candidate.status!=='draft' || candidate.eventId!==id || candidate.matches?.length || candidate.reports?.length){
   S=hqSafeDisplayState(raw,p.title,expected);hqSelectedMessage='Event state changed; save cancelled.';render();return;
 }
 if(!Array.isArray(candidate.teams)||candidate.teams.length<4||candidate.teams.length>12 ||
   !Array.isArray(candidate.courts)||candidate.courts.length<1||candidate.courts.length>8 ||
   new Set(candidate.teams.map(x=>x.id)).size!==candidate.teams.length ||
   candidate.teams.some(x=>!x.id||!String(x.name||'').trim()) ||
   candidate.courts.some(x=>!String(x||'').trim())){
   S=hqSafeDisplayState(raw,p.title,expected);hqSelectedMessage='Invalid teams or courts; save cancelled.';render();return;
 }
 if(JSON.stringify(candidate)===JSON.stringify(raw)){
   hqSelectedMessage='No changes to save.';render();return;
 }
 if(!confirm('Save changes from the existing Setup page to '+(p.title||'selected tournament')+'?\nOnly this event\'s draft state will be updated.')){
   S=hqSafeDisplayState(raw,p.title,expected);render();return;
 }
 hqSelectedSaving=true;hqSelectedMessage='Saving to selected event…';render();
 try{
   const {error}=await client.rpc('hq_multi_save',{p_event_id:id,p_data:candidate,p_expected:expected});
   if(error)throw error;
   const {data:verified,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
   if(readError)throw readError;
   if(verified?.data?.schema!==2||verified?.data?.eventId!==id||Number(verified.version)<=expected)
     throw Error('Updated cloud record could not be verified. Reload before another save.');
   if(hqInspectedId===id){
     hqEventPreview={...p,raw:verified,error:null};
     S=hqSafeDisplayState(verified.data,p.title,verified.version);
     hqSelectedMessage='Draft setup saved and verified · cloud version '+verified.version;
   }
 }catch(err){
   if(hqInspectedId===id){
     S=hqSafeDisplayState(raw,p.title,expected);
     hqSelectedMessage='Save not confirmed: '+(err?.message||String(err))+' — reselect the event before retrying.';
   }
 }finally{hqSelectedSaving=false;setupDraft=null;render()}
}

// N4-D: route the ORIGINAL Publish Schedule action through the selected event.
// The backend validates schedule integrity and authorizes the transition.
async function hqPublishSelectedEvent(){
 const id=hqInspectedId,p=hqEventPreview;
 if(!hqCanPublishSelected()){
   hqSelectedMessage='Publication is unavailable: select a saved, valid draft schedule and refresh the event.';
   render();return false;
 }
 const expected=Number(p.raw.version);
 const before=copy(p.raw.data);
 hqSelectedSaving=true;
 hqSelectedMessage='Checking current cloud schedule before publication…';
 render();
 try{
   // Re-read before prompting so a stale tab cannot publish a different schedule.
   const {data:fresh,error:freshError}=await client.rpc('hq_multi_view',{p_event_id:id});
   if(freshError)throw freshError;
   if(hqInspectedId!==id)throw Error('Event selection changed.');
   if(fresh?.data?.eventId!==id || fresh.data.schema!==2 ||
      fresh.data.status!=='draft' || Number(fresh.version)!==expected ||
      !hqSameJSON(fresh.data.matches,before.matches) ||
      !hqSameJSON(fresh.data.teams,before.teams) ||
      !hqSameJSON(fresh.data.courts,before.courts) ||
      !hqSameJSON(fresh.data.settings,before.settings))
      throw Error('Cloud schedule changed since it was loaded. Reselect this event before publishing.');
   const ok=confirm('PUBLISH '+(p.title||'selected tournament')+'?\n\n'+
     before.matches.length+' saved pool matches will become available through the event public view.\n'+
     'This changes only the selected event from Draft to Published. It does NOT start competition.\n\n'+
     'Continue with real cloud publication?');
   if(!ok){hqSelectedMessage='Publication cancelled. Cloud state unchanged.';return false;}
   hqSelectedMessage='Publishing selected event…';render();
   const {error:publishError}=await client.rpc('hq_multi_publish',{p_event_id:id,p_expected:expected});
   if(publishError)throw publishError;
   // The RPC may succeed even if the immediate follow-up read fails.
   // Never attempt another publish automatically.
   const {data:verified,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
   if(readError)throw Error('Publish RPC succeeded, but verification read failed: '+readError.message+'; reselect before retrying.');
   if(verified?.data?.eventId!==id || verified.data.schema!==2 ||
      verified.data.status!=='published' || Number(verified.version)<=expected ||
      !hqSameJSON(verified.data.matches,before.matches))
      throw Error('Publish RPC returned, but saved status or matches differ. Reselect event; do not retry blindly.');
   if(hqInspectedId===id){
     hqEventPreview={...p,raw:verified,error:null};
     S=hqSafeDisplayState(verified.data,p.title,verified.version);
     hqSelectedMessage='Published and verified · cloud version '+verified.version+
       ' · '+S.matches.length+' saved matches. Competition is NOT live.';
   }
   return true;
 }catch(err){
   // An uncertain result must never be treated as a failed transaction that is safe to retry.
   hqSelectedMessage='Publication NOT confirmed: '+(err?.message||String(err))+
     ' — reselect the event and inspect its status before doing anything else.';
   return false;
 }finally{hqSelectedSaving=false;render();}
}

// N4-E: event-aware operation behind the ORIGINAL Start Tournament button.
// A successful RPC transitions only the selected event from published to live.
async function hqStartSelectedEvent(){
 const id=hqInspectedId,p=hqEventPreview;
 if(!hqCanStartSelected()){
   hqSelectedMessage='Start Competition unavailable: reload a valid published tournament first.';
   render();return false;
 }
 const expected=Number(p.raw.version),before=copy(p.raw.data);
 hqSelectedSaving=true;
 hqSelectedMessage='Checking the published cloud schedule before activation…';
 render();
 try{
   const {data:fresh,error:freshError}=await client.rpc('hq_multi_view',{p_event_id:id});
   if(freshError)throw freshError;
   if(hqInspectedId!==id)throw Error('Selected event changed.');
   if(fresh?.data?.schema!==2 || fresh.data.eventId!==id ||
      fresh.data.status!=='published' || Number(fresh.version)!==expected ||
      !hqSameJSON(fresh.data.matches,before.matches) ||
      !hqSameJSON(fresh.data.teams,before.teams) ||
      !hqSameJSON(fresh.data.courts,before.courts) ||
      !hqSameJSON(fresh.data.settings,before.settings) ||
      !hqSameJSON(fresh.data.reports,before.reports))
      throw Error('Published cloud state changed; reselect this event and inspect before activation.');
   const ok=confirm('START COMPETITION — '+(p.title||'Selected tournament')+'?\n\n'+
     before.matches.length+' published pool matches will enter LIVE competition status.\n\n'+
     'This is a REAL cloud status change, not a simulation. The multi-event scoring and referee controls are still locked in this build.\n\n'+
     'Start this tournament now?');
   if(!ok){hqSelectedMessage='Activation cancelled. Cloud state unchanged.';return false;}
   hqSelectedMessage='Starting selected competition…';render();
   const {error:goError}=await client.rpc('hq_multi_go_live',{p_event_id:id,p_expected:expected});
   if(goError)throw goError;
   // No automatic retry: an uncertain follow-up read cannot safely reapply a write.
   const {data:verified,error:readError}=await client.rpc('hq_multi_view',{p_event_id:id});
   if(readError)throw Error('Activation RPC returned, but cloud verification failed: '+readError.message);
   if(verified?.data?.schema!==2 || verified.data.eventId!==id ||
      verified.data.status!=='live' || Number(verified.version)!==expected+1 ||
      !hqSameJSON(verified.data.matches,before.matches) ||
      !hqSameJSON(verified.data.teams,before.teams) ||
      !hqSameJSON(verified.data.courts,before.courts) ||
      !hqSameJSON(verified.data.settings,before.settings) ||
      !hqSameJSON(verified.data.reports,before.reports))
      throw Error('Activation returned but cloud state differs; reselect this event before another action.');
   if(hqInspectedId===id){
     hqEventPreview={...p,raw:verified,error:null};
     S=hqSafeDisplayState(verified.data,p.title,verified.version);
     hqSelectedMessage='Competition LIVE and verified · cloud version '+verified.version+
       '. Scoring and official actions remain locked pending event-aware integration.';
   }
   return true;
 }catch(err){
   // Even a network timeout can occur after the server applied the transition.
   hqSelectedMessage='Activation NOT confirmed: '+(err?.message||String(err))+
     ' — reselect event and inspect the cloud status; do not retry blindly.';
   return false;
 }finally{hqSelectedSaving=false;render();}
}

// N4-I / Flight 94: Create a real event using the existing catalog and engine RPCs.
// No duplicate workspace; initialization errors never trigger another catalog insertion.
function hqNewEventDialog(){
 if(!client||!session||cloudRole!=='director'||mode!=='director'||hqEventCreateBusy){
   alert('Sign in as an authorized director to create a tournament.');return;
 }
 const overlay=document.createElement('div');overlay.className='modalcover';
 overlay.innerHTML=`<form class="modal" id="hqNewEventForm" autocomplete="off">
   <h2>New Tournament</h2>
   <p class="note">Create a separate draft tournament in Tournament HQ.</p>
   <label for="hqNewTitle">Tournament name</label><input id="hqNewTitle" maxlength="120" required placeholder="The Spring Court" style="width:100%;margin-bottom:12px">
   <label for="hqNewDate">Event date (optional)</label><input id="hqNewDate" type="date" style="width:100%;margin-bottom:12px">
   <label for="hqNewVenue">Venue (optional)</label><input id="hqNewVenue" maxlength="180" placeholder="Venue" style="width:100%;margin-bottom:12px">
   <p class="notice bad" id="hqNewError" hidden></p>
   <div class="actions"><button class="btn primary" type="submit" id="hqNewConfirm">Create tournament</button><button class="btn ghost" type="button" id="hqNewCancel">Cancel</button></div>
 </form>`;
 document.body.appendChild(overlay);
 const close=()=>{if(!hqEventCreateBusy)overlay.remove()};
 overlay.querySelector('#hqNewCancel').onclick=close;
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 const titleInput=overlay.querySelector('#hqNewTitle');titleInput.focus();
 overlay.querySelector('#hqNewEventForm').onsubmit=async e=>{
   e.preventDefault();if(hqEventCreateBusy)return;
   const title=titleInput.value.trim(),date=overlay.querySelector('#hqNewDate').value||null,venue=overlay.querySelector('#hqNewVenue').value.trim()||null;
   if(!title||title.length>120||venue&&venue.length>180)return;
   if(!confirm(`Create a NEW draft tournament named "${title}"${date?' on '+date:''}?`))return;
   hqEventCreateBusy=true;
   const submit=overlay.querySelector('#hqNewConfirm'),errorBox=overlay.querySelector('#hqNewError');
   submit.disabled=true;overlay.querySelector('#hqNewCancel').disabled=true;submit.textContent='Creating…';
   let createdId=null;
   try{
     if(!client||!session||cloudRole!=='director')throw Error('Director session is unavailable.');
     const {data:id,error:createError}=await client.rpc('hq_event_catalog_add',{p_title:title,p_event_date:date,p_venue:venue});
     if(createError)throw createError;
     if(typeof id!=='string'||!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))throw Error('Catalog response did not contain an event ID; check the catalog before retrying.');
     createdId=id;
     const {data:init,error:initError}=await client.rpc('hq_multi_initialize',{p_event_id:id});
     if(initError){
       // A response may be lost after a successful initialization. Verify before reporting failure.
       const {data:maybe,error:verifyError}=await client.rpc('hq_multi_view',{p_event_id:id});
       if(verifyError||maybe?.data?.eventId!==id)throw Error('Event '+id+' was created, but initialization could not be verified: '+initError.message+'. Do not create it again; ask for recovery.');
     } else if(init?.event_id!==id||Number(init?.version)!==1||init?.status!=='draft'){
       throw Error('Event '+id+' was created; initialization returned unexpected data. Verify before retrying.');
     }
     overlay.remove();
     await hqCatalogReload();
     if(!hqEventCatalog.some(x=>x.id===id))throw Error('Event '+id+' was initialized, but the selector did not refresh. Refresh events; do not create it again.');
     await hqInspectEvent(id);
     if(hqEventPreview?.error||hqInspectedId!==id)throw Error('Event '+id+' was created. Selection could not be verified: '+(hqEventPreview?.error||'reload the event list'));
     hqSelectedMessage='New tournament created. Configure its draft using the existing Setup page.';
   }catch(err){
     const msg=err?.message||String(err);
     errorBox.hidden=false;
     errorBox.textContent=createdId?'Tournament ID: '+createdId+'. '+msg:msg;
     if(createdId)submit.textContent='Created — refresh selector';
     else submit.textContent='Create tournament';
     // Never rerun catalog insert after a confirmed creation.
     submit.disabled=!!createdId;
     overlay.querySelector('#hqNewCancel').disabled=false;
   }finally{hqEventCreateBusy=false;render();}
 };
}
// N5 reset: deliberately depends on a dedicated, atomic, server-authorized
// event reset RPC. Never emulate a reset using legacy hq_save or hq_multi_save.
// Reset may be requested for any lifecycle stage; the server MUST enforce
// director authorization, optimistic version checking and credential revocation.
let hqEventResetBusy=false;
async function hqResetIndependentEvent(eventId){
 if(hqEventResetBusy||hqEventManageBusy||hqSelectedSaving||hqEventCreateBusy||
    !client||!session||cloudRole!=='director'||mode!=='director'){
  alert('An authenticated Director is required, and other saves must be complete.');return false;
 }
 const catalog=hqEventCatalog.find(e=>e.id===eventId);
 if(!catalog||!hqUuid(eventId)){
  alert('Event not found in the authenticated catalog. Refresh and retry.');return false;
 }
 const title=String(catalog.title||'Untitled tournament');
 // A full reset discards competition, settings, teams, referees, sponsors,
 // reports and credentials. Shared Player Directory and form connections
 // must remain untouched. The event identity and catalog metadata remain.
 const phrase='RESET '+title;
 if(!confirm('FULL EVENT RESET — '+title+'\n\n'
   +'This permanently clears THIS event’s teams, settings, schedule, scores, brackets, reports, officials, sponsors and issued credentials. '
   +'It returns the event to a new empty DRAFT regardless of its previous competition status.\n\n'
   +'Shared player profiles and Jotform connections are NOT part of this reset. '
   +'Other tournaments are NOT affected.\n\nProceed to typed verification?'))return false;
 const typed=prompt('Enter this exact phrase to authorize resetting '+title+':\n\n'+phrase);
 if(typed!==phrase){if(typed!==null)alert('Reset canceled: verification phrase did not match.');return false;}
 const tail=eventId.slice(-8).toUpperCase();
 if(prompt('Second verification: type the last 8 characters of this event ID in uppercase.\n'+eventId)!==tail){
  alert('Reset canceled: event ID verification did not match.');return false;
 }
 hqEventResetBusy=true;
 let submitted=false;
 try{
  // Read the exact event and version immediately before submitting. No
  // frontend changes are made to the event before a successful server reset.
  const {data:before,error:readError}=await client.rpc('hq_multi_view',{p_event_id:eventId});
  if(readError)throw readError;
  const raw=before?.data,version=Number(before?.version);
  if(raw?.eventId!==eventId||raw.schema!==2||!Number.isSafeInteger(version)||version<1)
   throw Error('Event identity or cloud version could not be verified.');
  if(!confirm('FINAL CONFIRMATION\n'+title+'\nCloud version '+version+'\nEvent ID '+eventId+'\n\n'
   +'Irreversibly reset only this event to an empty Draft?'))return false;
  submitted=true;
  const {data:receipt,error}=await client.rpc('hq_multi_event_reset',{
   p_event_id:eventId,p_expected:version,p_confirmation:phrase
  });
  if(error)throw error;
  if(receipt!==true && receipt?.reset!==true)
   throw Error('Server did not confirm completion. Inspect the event before retrying.');
  const {data:after,error:verifyError}=await client.rpc('hq_multi_view',{p_event_id:eventId});
  if(verifyError)throw verifyError;
  const d=after?.data;
  if(d?.eventId!==eventId||d.schema!==2||d.status!=='draft'||
    !Array.isArray(d.matches)||d.matches.length!==0||
    !Array.isArray(d.reports)||d.reports.length!==0||
    !Array.isArray(d.teams)||d.teams.length!==0||
    !Number.isSafeInteger(Number(after.version))||Number(after.version)<=version)
   throw Error('Reset was submitted, but the new cloud record did not pass verification. Inspect before retrying.');
  // The server MUST revoke all event-issued credentials atomically with
  // the reset. Inspect active credential listings before claiming success.
  const {data:tokens,error:tokenError}=await client.rpc('hq_multi_token_list',{p_event_id:eventId});
  if(tokenError)throw Error('Event is Draft, but credential revocation could not be verified: '+tokenError.message);
  if(!Array.isArray(tokens)||tokens.some(t=>t?.active===true))
   throw Error('Event is Draft, but active referee/court credentials remain or token listing is invalid. Contact the Director before reusing this event.');
  for(const k of Object.keys(courtTokenCache))if(k.startsWith(eventId+':'))delete courtTokenCache[k];
  sessionStorage.setItem('hc-v5-court-tokens',JSON.stringify(courtTokenCache));
  pending=[];hqPendingError='';hqDraftSchedulePreview=null;setupDraft=null;
  if(hqInspectedId===eventId){
   hqEventPreview={id:eventId,title,raw:after,error:null};
   S=hqSafeDisplayState(d,title,after.version);tab='setup';
   hqSelectedMessage='Full event reset verified · fresh Draft · version '+after.version;
  }
  await hqCatalogReload();
  if(!hqEventCatalog.some(e=>e.id===eventId&&e.status==='planned'))
   throw Error('Reset data verified, but active catalog status was not confirmed; refresh before proceeding.');
  render();return true;
 }catch(err){
  const msg=(err?.message||String(err));
  alert((submitted?'RESET NOT VERIFIED. ':'Reset was not submitted. ')+msg+'\n\n'
   +(msg.includes('hq_multi_event_reset')||msg.includes('schema cache')||msg.includes('Could not find the function')
    ?'The required server-side hq_multi_event_reset function is not installed. No frontend fallback is permitted.'
    :'Refresh the event and verify its cloud state; do NOT retry blindly.'));
  return false;
 }finally{hqEventResetBusy=false;render();}
}

// N4-I Flight 98: Manage events from the ORIGINAL global selector.
// The server is authoritative: each operation checks director status and event data.
let hqEventManageBusy=false;
function hqManageEventDialog(){
 if(!client||!session||cloudRole!=='director'||mode!=='director'||hqEventManageBusy){
   alert('Sign in as an authorized director to manage tournaments.');return;
 }
 const overlay=document.createElement('div');overlay.className='modalcover';
 overlay.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Manage tournaments" style="max-width:680px">
   <h2>Manage Tournaments</h2>
   <p class="note">Archive to hide a tournament from the event selector without losing results. Restore to show it again. Permanent deletion is limited by the backend to empty, unused version-1 drafts.</p>
   <div id="hqManageEventList"></div>
   <p class="notice bad" id="hqManageEventError" hidden></p>
   <div class="actions"><button class="btn ghost" type="button" id="hqManageEventClose">Close</button></div>
 </div>`;
 document.body.appendChild(overlay);
 const close=()=>{if(!hqEventManageBusy)overlay.remove()};
 overlay.querySelector('#hqManageEventClose').onclick=close;
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 const display=()=>{
   const list=overlay.querySelector('#hqManageEventList');
   if(!list)return;
   list.innerHTML=hqEventCatalog.length?hqEventCatalog.map(e=>{
     const archived=e.status==='archived';
     const selected=e.id===hqInspectedId;
     return `<div class="tile" style="margin-bottom:10px">
       <div class="row"><strong>${esc(e.title||'Untitled tournament')}</strong><span class="tag">${archived?'Archived':'Active'}${selected?' · Selected':''}</span></div>
       <p class="note">${e.event_date?esc(e.event_date):'Date not set'}${e.venue?' · '+esc(e.venue):''}</p>
       <div class="actions">
         ${archived?`<button type="button" class="btn primary" data-hq-event-action="restore" data-hq-event-id="${esc(e.id)}">Restore</button>`:`<button type="button" class="btn" data-hq-event-action="archive" data-hq-event-id="${esc(e.id)}">Archive</button><button type="button" class="btn danger" data-hq-event-action="delete" data-hq-event-id="${esc(e.id)}">Delete unused draft</button>`}<button type="button" class="btn danger" data-hq-event-action="reset" data-hq-event-id="${esc(e.id)}">Full Reset (typed confirmation)</button>
       </div>
     </div>`;
   }).join(''):'<p class="note">No managed tournaments found.</p>';
   list.querySelectorAll('[data-hq-event-action]').forEach(b=>b.onclick=()=>perform(b.dataset.hqEventAction,b.dataset.hqEventId));
 };
 const perform=async(action,id)=>{
   if(hqEventManageBusy||hqSelectedSaving||hqEventCreateBusy)return;
   const e=hqEventCatalog.find(x=>x.id===id);
   if(!e||!['archive','restore','delete','reset'].includes(action))return;
   if(action==='reset'){
    const ok=await hqResetIndependentEvent(id);
    if(ok)display();
    return;
   }
   const title=e.title||'Untitled tournament';
   if(action==='archive'){
     if(!confirm(`Archive "${title}"?\n\nIt will disappear from the normal tournament selector. All existing tournament records will be preserved and the event can be restored.`))return;
   }else if(action==='restore'){
     if(!confirm(`Restore "${title}" to the active tournament selector?`))return;
   }else{
     const typed=prompt(`PERMANENT DELETION: "${title}".\n\nOnly a completely unused, empty version-1 draft can be deleted. This cannot be undone.\n\nType DELETE to request deletion:`);
     if(typed!=='DELETE')return;
     if(!confirm(`Final confirmation: permanently delete "${title}"?`))return;
   }
   const errorBox=overlay.querySelector('#hqManageEventError');
   errorBox.hidden=true;errorBox.textContent='';
   hqEventManageBusy=true;
   overlay.querySelectorAll('button').forEach(b=>b.disabled=true);
   try{
     if(!client||!session||cloudRole!=='director')throw Error('Director session is unavailable.');
     const endpoint=action==='archive'?'hq_multi_event_archive':action==='restore'?'hq_multi_event_restore':'hq_multi_event_delete_draft';
     const {data,error}=await client.rpc(endpoint,{p_event_id:id});
     if(error)throw error;
     if(data!==true)throw Error('Operation was not confirmed by Supabase. Refresh the catalog before retrying.');
     // Deselect before reload so the event state is never retained after archive/deletion.
     if(id===hqInspectedId && action!=='restore')await hqInspectEvent('legacy');
     await hqCatalogReload();
     const verified=hqEventCatalog.find(x=>x.id===id);
     if(action==='delete'&&verified)throw Error('Deletion was acknowledged but the event still appears in the catalog. Refresh to verify.');
     if(action==='archive'&&verified?.status!=='archived')throw Error('Archive was acknowledged but the catalog did not confirm archived status.');
     if(action==='restore'&&verified?.status!=='planned')throw Error('Restore was acknowledged but the catalog did not confirm active status.');
     hqSelectedMessage=`${title}: ${action==='delete'?'deleted':action==='archive'?'archived':'restored'} successfully.`;
     display();render();
   }catch(err){
     errorBox.textContent=(err?.message||String(err))+'. Existing records were not intentionally modified by the interface. Refresh the event catalog to verify the operation before retrying.';
     errorBox.hidden=false;
   }finally{
     hqEventManageBusy=false;
     overlay.querySelectorAll('button').forEach(b=>b.disabled=false);
   }
 };
 display();
}

// Authentication is project-wide, not owned by Harvest Crown's hq_view.
// Refresh the account role from its dedicated endpoint for every event context.
let hqRoleRefreshCounter=0;
async function hqRefreshAccountRole(){
 const seq=++hqRoleRefreshCounter, activeClient=client, activeSession=session;
 if(!activeClient||!activeSession){cloudRole='viewer';render();return 'viewer';}
 try{
  const {data,error}=await activeClient.rpc('hq_my_role');
  if(error)throw error;
  if(seq!==hqRoleRefreshCounter||activeClient!==client||!session||session.user?.id!==activeSession.user?.id)return cloudRole;
  cloudRole=['director','assistant'].includes(data)?data:'viewer';
  render();return cloudRole;
 }catch(err){
  if(seq===hqRoleRefreshCounter&&activeClient===client){
   cloudRole='viewer';
   hqSelectedMessage='Unable to verify account role: '+(err?.message||String(err))+'. Editing remains locked.';
   render();
  }
  return 'viewer';
 }
}
async function hqInspectEvent(id){
  if(hqSelectedSaving)return;
  setupDraft=null;hqSelectedMessage='';hqDraftSchedulePreview=null;pending=[];hqPendingError='';
  const serial=++hqSelectionSerial;
  if(client&&session)void hqRefreshAccountRole();
  if(id==='legacy'){
    hqInspectedId='legacy';hqEventPreview=null;
    if(hqLegacySnapshot)S=hqLegacySnapshot;
    hqLegacySnapshot=null;notice='';tab='setup';render();return;
  }
  const e=hqEventCatalog.find(x=>x.id===id);
  if(!e){hqInspectEvent('legacy');return}
  if(!hqViewingSelected())hqLegacySnapshot=S;
  hqInspectedId=id;
  hqEventPreview={loading:true,title:e.title||'Event'};
  notice='';tab='setup';render();
  try{
    const {data,error}=await client.rpc('hq_multi_view',{p_event_id:id});
    if(error)throw error;
    if(serial!==hqSelectionSerial||hqInspectedId!==id)return;
    const raw=data?.data??data;
    if(raw?.schema!==2||raw?.eventId!==id)throw Error('Selected event identity or schema mismatch');
    hqEventPreview={title:e.title||'Event',id,raw:data,error:null};
    S=hqSafeDisplayState(raw,e.title,data?.version);
    await hqRefreshSelectedPending();
    // On event load, safely resume any approved semifinal advancement that
    // was interrupted after a successful score approval. Never touch pool scores.
    if(serial===hqSelectionSerial && hqInspectedId===id && S.status==='live' &&
       mode==='director' && cloudRole==='director')
      await hqReconcileApprovedPlayoffs(id);
  }catch(err){
    if(serial!==hqSelectionSerial||hqInspectedId!==id)return;
    hqEventPreview={title:e.title||'Event',id,error:err.message||String(err)};
  }
  render();
}

async function hqRunOriginalSchedule(){

 if(!hqCanEditSelectedDraft()||hqDraftSchedulePreview){alert('Schedule generation is available only for an empty draft event.');return;}
 const before=copy(S),oldRaw=copy(p.raw.data),expected=Number(p.raw.version);
 // The original generator is invoked without making its legacy local() save call.
 hqScheduleGenerating=true;
 try{generate();}catch(err){S=before;hqSelectedMessage='Schedule generation failed: '+(err?.message||err);}
 finally{hqScheduleGenerating=false;}
 if(!Array.isArray(S.matches)||!S.matches.length||S.matches.some(m=>m.stage!=='pool'||m.status!=='scheduled'||!Array.isArray(m.sets)||m.sets.length)){
   S=before;hqSelectedMessage='No valid unscored pool schedule was produced. Nothing was saved.';render();return;
 }
 const problems=validate(),errors=problems.filter(x=>x.level==='error');
 if(errors.length){S=before;hqSelectedMessage='Schedule rejected: '+errors.slice(0,3).map(x=>x.msg).join(' | ');render();return;}

 candidate.teams=copy(S.teams);
 candidate.matches=copy(S.matches);
 candidate.settings={...(oldRaw.settings||{}),poolRepeats:S.settings.poolRepeats};
 // Never persist UI-only defaults, audit entries or newly synthesized reports.
 if(candidate.status!=='draft'||candidate.eventId!==id||oldRaw.matches?.length||oldRaw.reports?.length||candidate.matches.some(m=>m.stage!=='pool')){
   S=before;hqSelectedMessage='Event changed or is not empty. No schedule was saved.';render();return;
 }
 hqDraftSchedulePreview={id,expected,candidate,matchCount:S.matches.length,teams:S.teams.length,courts:S.courts.length,warnings:problems.length};
 hqSelectedMessage='Generated using the original Tournament HQ schedule engine. Cloud unchanged; review before saving.';
 tab='matches';render();
}

// Compare parsed JSON data semantically, not property insertion order.
// PostgreSQL jsonb can reorder object keys without changing their meaning.
function hqCanonicalJSON(value){
 if(Array.isArray(value))return value.map(hqCanonicalJSON);
 if(value!==null && typeof value==='object'){
   const sorted={};
   for(const key of Object.keys(value).sort())sorted[key]=hqCanonicalJSON(value[key]);
   return sorted;
 }
 return value;
}
function hqSameJSON(a,b){
 return JSON.stringify(hqCanonicalJSON(a))===JSON.stringify(hqCanonicalJSON(b));
}
async function hqSaveSchedulePreview(){
 const preview=hqDraftSchedulePreview,p=hqEventPreview;
 if(!preview||hqSelectedSaving||!client||!session||cloudRole!=='director'||
   !hqViewingSelected()||hqInspectedId!==preview.id||p?.id!==preview.id||
   Number(p.raw.version)!==preview.expected||p.raw.data?.status!=='draft'||
   p.raw.data?.matches?.length!==0||p.raw.data?.reports?.length!==0){
    hqSelectedMessage='Event context changed. No schedule sent; reload and regenerate.';hqDiscardSchedulePreview();return;
 }
 const errors=validate().filter(x=>x.level==='error');
 if(errors.length){hqSelectedMessage='Schedule has critical issues; cloud unchanged.';render();return;}
 if(!confirm('Save '+preview.matchCount+' pool matches to '+p.title+' at cloud version '+preview.expected+'? The event remains Draft and the resulting schedule becomes locked.'))return;
 hqSelectedSaving=true;hqSelectedMessage='Saving selected event schedule…';render();
 try{
   const {error}=await client.rpc('hq_multi_save',{p_event_id:preview.id,p_data:preview.candidate,p_expected:preview.expected});
   if(error)throw error;
   const {data:verified,error:readError}=await client.rpc('hq_multi_view',{p_event_id:preview.id});
   if(readError)throw readError;
   if(verified?.data?.eventId!==preview.id || !Number.isFinite(Number(verified.version)) ||
      Number(verified.version)<=preview.expected || verified.data.status!=='draft')
      throw Error('Cloud returned an unexpected event, version, or status. Reselect the event to inspect it; do not save again.');
   // The version has advanced and the event identity was verified. Always show
   // the actual cloud state; never restore a stale local preview after a successful RPC.
   if(hqInspectedId===preview.id){
      const matchesEqual=hqSameJSON(verified.data.matches,preview.candidate.matches);
      hqEventPreview={...p,raw:verified,error:null};
      S=hqSafeDisplayState(verified.data,p.title,verified.version);
      hqDraftSchedulePreview=null;
      hqSelectedMessage=matchesEqual
        ? 'Schedule saved and verified · cloud version '+verified.version+' · '+S.matches.length+' matches'
        : 'Cloud save returned successfully and version advanced to '+verified.version+
          ', but the stored schedule differs from the preview. Review the cloud schedule before taking further action; do not resave blindly.';
   }
 }catch(err){
   if(hqInspectedId===preview.id){
      hqSelectedMessage='Save NOT confirmed: '+(err?.message||String(err))+' — reselect event to verify before retrying.';
      hqDraftSchedulePreview=null;
      S=hqSafeDisplayState(p.raw.data,p.title,p.raw.version);
   }
 }finally{hqSelectedSaving=false;render();}
}

// V8.4.0 RC2 read-only dependency review. Never modifies scores, players, or assignments.
function recoveryDependents(match){
 if(match.stage!=='playoff')return [];
 const games=S.matches.filter(x=>x.stage==='playoff'&&x.slot!=='BYE');
 const maxRound=Math.max(-1,...games.map(x=>Number(x.round)));
 const result=[];
 for(let r=Number(match.round)+1;r<=maxRound;r++){
  const index=Math.floor(Number(match.index)/Math.pow(2,r-Number(match.round)));
  const dependent=games.find(x=>Number(x.round)===r&&Number(x.index)===index);
  if(dependent)result.push(dependent);
 }
 return result;
}

 return isDone(m)?'Finalized':isPending?'Pending approval':(!m.home||!m.away)?'Awaiting participants':'Missing result';
}

function lifecycleControls(){
 const errors=validate().filter(x=>x.level==='error'),warnings=validate().filter(x=>x.level==='warn');
 const ready=S.matches.length>0&&!errors.length;
 const stage=S.status==='draft'&&ready?'Ready to publish':S.status;
 // Show the selected engine's cloud metadata, never the legacy Harvest Crown sync label.
 const selectedCloud=hqViewingSelected();
 const verifiedSelection=selectedCloud && hqEventPreview?.id===hqInspectedId &&
   hqEventPreview?.raw?.data?.eventId===hqInspectedId &&
   Number.isSafeInteger(Number(hqEventPreview?.raw?.version)) && Number(hqEventPreview.raw.version)>0;
 const cloudNote=selectedCloud
   ? verifiedSelection
     ? `Selected event cloud: version ${esc(hqEventPreview.raw.version)} · ${esc(hqEventPreview.raw.data.status)} · ${esc(cloudRole)}`
     : `Selected event cloud: ${esc(hqEventPreview?.loading?'loading':hqEventPreview?.error||'not verified; refresh selected event')}`
   : liveMode?`Cloud: ${esc(sync)} · ${esc(cloudRole)}`:'Local practice (not shared across devices)';
 return `<div class="notice ${errors.length?'bad':ready?'good':''}"><strong>Current stage: ${esc(stage)}</strong><br>${S.matches.length} scheduled matches · ${errors.length} critical errors · ${warnings.length} warnings<br><small>${cloudNote}</small></div>
 <p class="note">Draft and validation are automatic. Publishing shares the schedule with captains and spectators; starting the tournament activates match-day operation.</p>
 <div class="actions">${S.status==='draft'||S.status==='validated'?`<button class="btn primary" id="publishSchedule" ${!ready?'disabled':''}>✓ Publish Schedule</button>`:''}
 ${S.status==='published'?'<button class="btn primary" id="startTournament">▶ Start Tournament</button>':''}
 ${S.status==='live'?'<button class="btn primary" id="finishTournament">★ Finish Tournament</button>':''}
 ${['published','live'].includes(S.status)?'<button class="btn" id="openRun">Open Run Tournament →</button>':''}
 ${['published','live'].includes(S.status)?'<button class="btn" id="reviseSchedule">↻ Revise Schedule</button>':''}
 ${S.status==='completed'?'<div class="notice good">Tournament completed. Results are retained.</div>':''}</div>
 ${!ready?'<p class="note">Generate a schedule and resolve critical Safety issues to enable publication.</p>':''}
 ${warnings.length?'<p class="note">Staffing/rest warnings remain. Review Safety before publishing.</p>':''}`;
}
async function changeLifecycle(target){
 if(hqViewingSelected()){if(target==='published')return hqPublishSelectedEvent();if(target==='live')return hqStartSelectedEvent();if(target==='completed')return hqFinishSelectedEvent();alert('This selected-event lifecycle action is not connected yet. No changes were made.');return;}
 if(mode!=='director'||(liveMode&&cloudRole!=='director')){alert('Director access required.');return}
 if(target==='draft'){
  if(!['published','live'].includes(S.status)){alert('Schedule is already editable.');return}
  if(S.matches.some(isDone)||S.reports.some(r=>r.status==='pending')||pending.some(r=>r.status==='pending')){
   alert('Schedule regeneration is disabled because completed matches or pending score reports exist. Use Quick Fix for individual changes, or export a backup and contact an administrator for a controlled reset.');return;
  }
  if(!confirm('Reopen schedule editing? This temporarily returns the tournament to Draft. Previously published viewers may see the existing schedule until you publish the revision. Re-publish once all changes pass Safety.'))return;
 }else if(target==='published'){
  if(!S.matches.length||validate().some(x=>x.level==='error')){alert('Generate a schedule and resolve critical Safety errors first.');tab='safety';render();return}
  if(S.status!=='draft'&&S.status!=='validated'){alert('Tournament has already been published.');return}
  if(!confirm(`Publish ${S.matches.length} matches? ${validate().filter(x=>x.level==='warn').length} warnings remain. Public viewers will be able to see the schedule.`))return;
 }else if(target==='live'){
  if(S.status!=='published'){alert('Publish the schedule first.');return}
  if(!confirm('Start tournament operations now?'))return;
 }else if(target==='completed'){
  if(S.status!=='live')return;
  if(!tournamentChampion()){alert('Approve the championship result before finishing the tournament.');return}
  if(S.matches.some(m=>m.stage==='playoff'&&m.slot!=='BYE'&&!isDone(m))){alert('Finalize every playoff match before finishing.');return}
  if(pending.some(r=>r.status==='pending')||S.reports.some(r=>r.status==='pending')){alert('Review all pending score submissions before finishing.');return}
  if(!confirm('Finish tournament and preserve results?'))return;
 }
 const prior=S.status;S.status=target;audit('Stage changed','Director',target);
 if(liveMode){
  if(!client||!session){S.status=prior;alert('Cloud is disconnected. No changes published.');return}
  dirty=true;
  const ok=await pushCloud(true);
  if(!ok){S.status=prior;dirty=true;alert('Cloud publication failed. Status was not advanced. Check Cloud and retry.');return}
  dirty=false;notice=target==='draft'?'Schedule reopened for editing. Generate your revision, check Safety, then publish again.':target==='published'?'Schedule published to cloud. Captain and spectator views can now see it.':target==='live'?'Tournament is live. Open Run Tournament.':'Tournament completed and saved.';
 }else{local();notice='Local practice stage updated; not visible on other devices.'}
 if(target==='live')tab='home';render();
}

function helpForIssue(msg){
if(msg.includes('no assigned referee'))return ['No eligible official was available in that time slot under the current staffing and match schedule.','Open Officials to assign an available referee, change staffing mode, or move the match to a free time slot.','assignments'];
if(msg.includes('no line judges assigned'))return ['No available nonplaying team was assigned to cover the line judging duty.','Check both courts at that time. Assign a free team in Officials, supply separate line judges, or move this match.','assignments'];
if(msg.includes('concurrent matches'))return ['One team is assigned to officiate two overlapping matches.','Reassign one duty to another free team or adjust one match time.','assignments'];
if(msg.includes('minutes between'))return ['The team has less than the requested rest period between matches.','Try moving the later match to a free slot in Quick Fix.','quick'];
if(msg.includes('overlap')||msg.includes('double-booked')||msg.includes('simultaneously'))return ['Two commitments overlap, so both cannot be fulfilled as scheduled.','Use Quick Fix to change a time, court, or referee, then rerun validation.','quick'];
if(msg.includes('end time'))return ['The allotted match time would finish after the configured end of the tournament.','Shorten the format or match duration, extend the event window, or shift a match earlier.','setup'];
return ['This check detected an issue that may require director review.','Review the matches and assignments involved; rerun safety checks after making changes.','matches'];
}

oad Schedule CSV</button><button class="btn ghost" id="import">Restore Backup</button></div><input type="file" id="file" accept="application/json" style="display:none"><p class="note">Download and retain a backup before structural changes. Local mode only saves on this device.</p></div></details><details class="panel"><summary style="cursor:pointer;font-weight:700">Advanced · Audit History</summary><div style="margin-top:12px">${S.audit.slice().reverse().slice(0,70).map(x=>`<div class="tile"><strong>${esc(x.action)}</strong><div class="mini">${esc(x.by)} · ${esc(new Date(x.at).toLocaleString())}</div><div class="note">${esc(x.detail)}</div></div>`).join('')||'<p class="note">Approved results and corrections will appear here.</p>'}</div></details>`}

function clockRemaining(){const c=S.clock||{};if(c.running&&c.endsAt)return Math.max(0,c.endsAt-Date.now());return Math.max(0,Number(c.remainingMs??1200000))}
function clockDisplay(){const ms=clockRemaining(),sec=Math.ceil(ms/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function clockPanel(){const c=S.clock||{},ready=S.status==='live';const manage=mode==='director'&&(!liveMode||cloudRole==='director');const breakMode=c.phase==='lunch break';const resume= S.settings.preferredBracketStart||'14:00';return `<div class="panel" style="text-align:center;border:2px solid #f0bd35;background:#132a4b;color:white"><div style="font-weight:800;letter-spacing:1px">TOURNAMENT CLOCK · ${esc((c.phase||'pool').toUpperCase())}</div><div id="hqClock" style="font-size:clamp(54px,9vw,112px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;color:#f0bd35">${clockDisplay()}</div><div style="font-size:14px">${!ready?'Available after tournament activation':c.running?'RUNNING':clockRemaining()===0?'TIME EXPIRED':'PAUSED / READY'} · Director controlled</div>${breakMode?`<p style="color:#f0bd35">Lunch / tournament break · scheduled bracket start ${esc(resume)}</p>`:''}<div class="actions" style="margin-top:12px;justify-content:center"><button class="btn" id="enableClockSound" type="button">🔔 Enable Timer Sound</button></div>${manage?`<div class="actions" style="margin-top:12px;justify-content:center"><button class="btn primary" id="clockToggle" ${ready?'':'disabled'}>${c.running?'Pause':'Start / Resume'}</button><button class="btn" id="clockReset" ${ready?'':'disabled'}>Reset ${c.phase==='bracket'?S.settings.playoffMinutes:S.settings.minutes} min</button><button class="btn" id="clockBreak" ${ready?'':'disabled'}>1-min set break</button><button class="btn" id="clockNext" ${ready?'':'disabled'}>3-min transition</button><button class="btn" id="clockLunch" ${ready?'':'disabled'}>${breakMode?'End Break / Restore Clock':'Start Lunch / Break'}</button><button class="btn" id="clockBracket" ${ready?'':'disabled'}>Bracket clock</button></div>`:''}<p style="font-size:12px;opacity:.8">The clock is advisory. Lunch does not modify published match times. Pause and resume are Director-controlled.</p></div>`}
function setClock(action){if(mode!=='director'||(liveMode&&cloudRole!=='director')||S.status!=='live')return;let c=S.clock||{phase:'pool',remainingMs:Number(S.settings.minutes)*60000,running:false};const rem=clockRemaining();if(action==='lunch'){if(c.phase==='lunch break'){c=c.previousClock||{phase:'pool',remainingMs:Number(S.settings.minutes)*60000,running:false,endsAt:null};c.running=false;c.endsAt=null;}else{const hold={...c,remainingMs:rem,running:false,endsAt:null};c={phase:'lunch break',running:false,remainingMs:Number(S.settings.postPoolBreak??30)*60000,endsAt:null,previousClock:hold};}}else if(action==='toggle'){c.running=!c.running;c.remainingMs=rem;c.endsAt=c.running?Date.now()+rem:null}else if(action==='reset'){c.running=false;c.remainingMs=Number(c.phase==='bracket'?S.settings.playoffMinutes:c.phase==='lunch break'?(S.settings.postPoolBreak??30):S.settings.minutes)*60000;c.endsAt=null}else if(action==='break'){c={phase:'set break',running:false,remainingMs:60000,endsAt:null}}else if(action==='next'){c={phase:'transition',running:false,remainingMs:Number(S.settings.breakMinutes??3)*60000,endsAt:null}}else if(action==='bracket'){c={phase:'bracket',running:false,remainingMs:Number(S.settings.playoffMinutes)*60000,endsAt:null}}S.clock=c;audit('Clock control','Director',action+' · '+clockDisplay());local()}
// Web Audio needs a user gesture on iOS/Safari. Each viewing device must enable sound.
let hqAudio=null, hqSoundEnabled=false, hqLastClockRun=null, hqExpirySignaled=new Set(), hqArmedRuns=new Set();
function enableClockSound(){
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)throw Error('Audio not supported');
  if(!hqAudio)hqAudio=new AudioCtor();
  hqAudio.resume();
  hqSoundEnabled=true;
  const b=$('enableClockSound');if(b)b.textContent='🔊 Sound Enabled';
 }catch(e){alert('This browser could not enable the timer sound: '+e.message)}
}
function beepClockEnd(){
 if(!hqSoundEnabled||!hqAudio)return;
 try{
  hqAudio.resume();
  const base=hqAudio.currentTime+0.02;
  // Three clear short tones to distinguish a completed countdown from an ordinary notification.
  for(let i=0;i<3;i++){
   const osc=hqAudio.createOscillator(),gain=hqAudio.createGain(),t=base+i*.30;
   osc.type='sine';osc.frequency.setValueAtTime(880,t);
   gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.20,t+.02);
   gain.gain.setValueAtTime(.20,t+.18);gain.gain.linearRampToValueAtTime(0,t+.24);
   osc.connect(gain);gain.connect(hqAudio.destination);osc.start(t);osc.stop(t+.25);
  }
 }catch(e){console.warn('Timer sound unavailable',e)}
}
function tickClock(){
 const el=$('hqClock');if(el)el.textContent=clockDisplay();
 const c=S.clock||{},key=c.running&&c.endsAt?String(c.endsAt)+'|'+(c.phase||'pool'):null;
 if(key){
  if(hqLastClockRun!==key){hqLastClockRun=key;}
  if(clockRemaining()>0)hqArmedRuns.add(key);
  if(clockRemaining()===0&&hqArmedRuns.has(key)&&!hqExpirySignaled.has(key)){
   hqExpirySignaled.add(key);beepClockEnd();
  }
 }else{hqLastClockRun=null}
}
setInterval(tickClock,250);

// N4-F2 — Credentials are scoped by the backend identity, never the director selector.
function hqUuid(v){return typeof v==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)}
function hqCacheKey(c){return (hqViewingSelected()?hqInspectedId:'legacy')+':'+String(c)}
function hqCourtCached(c){return courtTokenCache[hqCacheKey(c)] || (!hqViewingSelected()?courtTokenCache[c]:null)}
function hqScopedIdentityId(v){const raw=v?.event_id??v?.eventId??v?.event?.id??'';return String(raw).startsWith('event:')?String(raw).slice(6):String(raw)}
function hqPublicState(v){const r=v?.data??v?.state??v;return r?.data?.matches?r.data:r}
// N4-G: The original captain/display pages get their data solely from the
// event ID in their own HTTPS URL and the allowlisted public RPC. No local
// storage fallback, director selector, or legacy hq_view for scoped viewers.
async function hqLoadScopedPublic(){
 if(!hqPublicTarget||!client||hqPublicInFlight)return;
 const target=hqPublicTarget;
 if(!hqUuid(target)){
   hqPublicError='Invalid tournament identifier';hqPublicLoaded=false;
   S=defaults();S.title='Tournament unavailable';S.teams=[];S.matches=[];render();return;
 }
 hqPublicInFlight=true;
 try{
   const {data,error}=await client.rpc('hq_multi_public_view',{p_event_id:target});
   if(error)throw Error(error.message||'Public event is unavailable');
   const state=hqPublicState(data);
   if(!state||!Array.isArray(state.teams)||!Array.isArray(state.matches)||
      !['published','live','completed'].includes(state.status)||
      (state.eventId && state.eventId!==target))
      throw Error('Public response failed event, state, or shape verification');
   // Avoid showing a stale/different event, even momentarily.
   hqInspectedId=target;
   const title=String(state.title||hqEventPreview?.title||'Tournament');
   hqEventPreview={id:target,title,raw:{data:state,version:data?.version??0}};
   S=hqSafeDisplayState(state,title,data?.version??0);
   hqPublicLoaded=true;hqPublicError='';sync='Public event synced';
 }catch(e){
   hqPublicError='Unable to refresh this tournament: '+(e?.message||String(e));
   // If this event was previously loaded, retain only its same-event last good
   // public snapshot, but display a warning. Never fall back to Harvest Crown.
   if(!hqPublicLoaded){S=defaults();S.title='Tournament unavailable';S.teams=[];S.matches=[];S.refs=[];S.courts=[];S.sponsors=[];}
 }finally{hqPublicInFlight=false;render();}
}
async function hqInitializeScopedCredential(){
 if(!refSecret&&!courtSecret)return false;
 if(!hqCredentialTarget)return false; // Legacy QR remains legacy.
 if(!hqUuid(hqCredentialTarget))throw Error('Invalid event identifier in credential link');
 const rpc=courtSecret?'hq_multi_court_identity':'hq_multi_ref_identity';
 const args=courtSecret?{p_secret:courtSecret,p_court:courtIndex}:{p_secret:refSecret};
 const {data:identity,error:identityError}=await client.rpc(rpc,args);
 if(identityError||!identity||typeof identity!=='object')throw Error('Credential invalid, revoked or missing event identity');
 if(hqScopedIdentityId(identity)!==hqCredentialTarget)throw Error('Credential does not belong to the linked tournament');
 const {data:publicView,error:viewError}=await client.rpc('hq_multi_public_view',{p_event_id:hqCredentialTarget});
 if(viewError)throw Error('Tournament view unavailable: '+viewError.message);
 const r=hqPublicState(publicView);
 if(!r||!Array.isArray(r.matches)||!Array.isArray(r.teams)||!['published','live','completed'].includes(r.status))throw Error('Credential event view is unavailable');
 if(r.eventId&&r.eventId!==hqCredentialTarget)throw Error('Public data belongs to a different tournament');
 hqCredentialEventId=hqCredentialTarget;hqCredentialVerified=true;
 hqInspectedId=hqCredentialTarget;
 hqEventPreview={id:hqCredentialEventId,title:r.title||'Tournament',raw:{data:r,version:r.version||0}};
 S=hqSafeDisplayState(r,r.title||'Tournament',r.version);
 courtValid=!!courtSecret;
 if(refSecret){cloudRefName=String(identity.name??identity.referee_name??'');if(!cloudRefName)throw Error('Referee identity name missing');
   const ref=S.refs.find(x=>x.name===cloudRefName),t=S.teams.find(x=>x.name===cloudRefName);
   selectedRef=ref?.id||(t?'team:'+t.id:'');
   if(!selectedRef)throw Error('Referee is not assigned to this tournament');
 }
 mode='referee';tab='submit';sync='Event credential verified';return true;
}
function courtUrl(c,token){const u=new URL(location.origin+location.pathname);u.searchParams.set('mode','referee');u.searchParams.set('court',String(c));if(token)u.searchParams.set('court_token',token);if(hqViewingSelected())u.searchParams.set('event',hqInspectedId);if(cloud?.url&&cloud?.key){u.searchParams.set('sb_url',cloud.url);u.searchParams.set('sb_key',cloud.key)}return u.href}
async function issueCourtCode(c){
 if(!liveMode||!client||!session||cloudRole!=='director'){alert('Connect as director to issue court access.');return}
 if(!['published','live'].includes(S.status)){alert('Publish the tournament first.');return}
 if(hqViewingSelected() && location.protocol!=='https:'){alert('Open the deployed HTTPS site before issuing event QR credentials.');return}
 if(hqViewingSelected()){
   if(hqEventPreview?.id!==hqInspectedId||!hqEventCatalog.some(e=>e.id===hqInspectedId&&e.status==='planned')){alert('Selected event could not be verified');return}
 }
 if(hqCourtCached(c)&&!confirm('Issue another credential for this court? Existing credentials remain active.'))return;
 const args=hqViewingSelected()?{p_event_id:hqInspectedId,p_court:c}:{p_court:c};
 const {data,error}=await client.rpc(hqViewingSelected()?'hq_multi_court_issue':'hq_court_issue',args);
 if(error||typeof data!=='string'||!data){alert('Court credential not created: '+(error?.message||'Invalid response'));return}
 courtTokenCache[hqCacheKey(c)]=data;
 sessionStorage.setItem('hc-v5-court-tokens',JSON.stringify(courtTokenCache));
 note('Court '+(c+1)+' credential created for '+S.title+'. Print the QR packet.');
}
async function revokeCourtCode(c){
 if(hqViewingSelected()){await hqListEventTokens('court',c);return}
 if(!liveMode||cloudRole!=='director')return;
 if(!confirm('Revoke ALL Court '+(c+1)+' codes? Reprint a new QR packet afterward.'))return;
 const {error}=await client.rpc('hq_court_revoke',{p_court:c});
 if(error){alert(error.message);return}
 delete courtTokenCache[c];delete courtTokenCache[hqCacheKey(c)];
 sessionStorage.setItem('hc-v5-court-tokens',JSON.stringify(courtTokenCache));
 note('Court '+(c+1)+' QR access revoked.');
}
// Shared, read-only graphic catalog. Assets are not stored in a tournament's hq_state.

 {id:'hc-court-1',kind:'art',title:'Harvest Crown Classic · Court 1',subtitle:'Approved artwork · fixed tournament title',asset:'hc1'},
 {id:'hc-court-2',kind:'placeholder',title:'Harvest Crown Classic · Court 2',subtitle:'Artwork not yet provided'},
 {id:'neutral-court-1',kind:'court',court:1,title:'Neutral · Court 1',subtitle:'Adapts to selected event name'},
 {id:'neutral-court-2',kind:'court',court:2,title:'Neutral · Court 2',subtitle:'Adapts to selected event name'},
 {id:'neutral-captain',kind:'qr',qr:'captain',title:'Neutral · Captain’s View QR',subtitle:'Uses selected event’s verified public link'},
 {id:'neutral-display',kind:'qr',qr:'display',title:'Neutral · Public Display QR',subtitle:'Uses selected event’s verified public link'},
