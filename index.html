 {id:'royal-rally',kind:'placeholder',title:'Royal Rally · Theme',subtitle:'Awaiting approved artwork'}
];
// Shared artwork metadata lives in hq_graphic_assets, outside every tournament.
// Only approved, non-sensitive images are uploaded to the public artwork bucket.
const HQ_ASSET_BUCKET='hq-shared-graphics';
let hqAssetRows=[],hqAssetLoaded=false,hqAssetLoading=false,hqAssetBusy=false,hqAssetError='';
const hqAssetDirector=()=>!!client&&!!session&&liveMode&&cloudRole==='director'&&mode==='director';
function hqAssetUrl(row){
 if(!client||!row?.object_path||!/^(?:art\/)[a-f0-9-]{36}\.(?:png|jpg|webp)$/.test(row.object_path))return '';
 return client.storage.from(HQ_ASSET_BUCKET).getPublicUrl(row.object_path).data?.publicUrl||'';
}
function hqAssetById(id){return hqAssetRows.find(r=>r.id===id)||null;}
function hqAssetArtwork(id){const row=hqAssetById(id);return row?hqAssetUrl(row):id==='hc-court-1'?HQ_GRAPHIC_HARVEST_COURT1:'';}
async function hqAssetsLoad(force=false){
 if(hqAssetLoading||(!force&&hqAssetLoaded)||!client||!liveMode)return;
 hqAssetLoading=true;hqAssetError='';
 try{
  const {data,error}=await client.from('hq_graphic_assets').select('id,title,object_path,created_at,updated_at').order('title');
  if(error)throw error;
  hqAssetRows=Array.isArray(data)?data.filter(r=>typeof r?.id==='string'&&/^[a-z0-9-]{1,80}$/.test(r.id)&&hqAssetUrl(r)):[];
  hqAssetLoaded=true;
 }catch(e){hqAssetError='Cloud artwork unavailable: '+(e?.message||String(e));hqAssetLoaded=true;}
 finally{hqAssetLoading=false;if(tab==='prints')render();}
}
async function hqAssetUpload(){
 if(!hqAssetDirector()||hqAssetBusy){alert('Sign in as Director to upload shared artwork.');return;}
 const file=document.getElementById('hqAssetFile')?.files?.[0];
 const title=(document.getElementById('hqAssetTitle')?.value||'').trim();
 const slot=document.getElementById('hqAssetSlot')?.value||'new';
 if(!file||!title||title.length>120){alert('Choose an image and enter a title (1–120 characters).');return;}
 const extensions={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'};
 const ext=extensions[file.type];
 if(!ext||file.size<100||file.size>8*1024*1024){alert('Choose a PNG, JPG or WebP image under 8 MB.');return;}
 // A random, immutable object path prevents cached images and accidental overwrites.
 const path='art/'+crypto.randomUUID()+'.'+ext;
 const id=slot==='new'?'user-'+crypto.randomUUID():slot;
 const old=hqAssetById(id);
 if(old&&!confirm('Replace the shared artwork for '+old.title+'? Every tournament will see the new image.'))return;
 hqAssetBusy=true;
 try{
  const uploaded=await client.storage.from(HQ_ASSET_BUCKET).upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});
  if(uploaded.error)throw uploaded.error;
  const {error}=await client.from('hq_graphic_assets').upsert({id,title,object_path:path,updated_by:session.user.id},{onConflict:'id'});
  if(error){await client.storage.from(HQ_ASSET_BUCKET).remove([path]);throw error;}
  await hqAssetsLoad(true);
  // Removing old artwork is best-effort; metadata already points to the new file.
  if(old?.object_path && old.object_path!==path)void client.storage.from(HQ_ASSET_BUCKET).remove([old.object_path]);
  alert('Shared artwork saved. It is now available for every tournament.');
 }catch(e){alert('Artwork was NOT saved: '+(e?.message||String(e)));}
 finally{hqAssetBusy=false;render();}
}
async function hqAssetRemove(id){
 if(!hqAssetDirector()||hqAssetBusy)return;
 const old=hqAssetById(id);if(!old)return;
 if(!confirm('Remove '+old.title+' from the shared graphics library for ALL tournaments?'))return;
 hqAssetBusy=true;
 try{
  const {error}=await client.from('hq_graphic_assets').delete().eq('id',id);
  if(error)throw error;
  await hqAssetsLoad(true);
  // Keep the old image as an unlinked backup if the Storage deletion fails.
  if(old.object_path)void client.storage.from(HQ_ASSET_BUCKET).remove([old.object_path]);
 }catch(e){alert('Artwork removal failed: '+(e?.message||String(e)));}
 finally{hqAssetBusy=false;render();}
}
function hqAssetManagementUi(){
 if(!hqAssetDirector())return '<p class="note">Sign in as Director to upload or replace graphics. All tournaments can use the same library.</p>';
 const slots=HQ_GRAPHICS.filter(g=>g.kind==='placeholder'||g.kind==='art').map(g=>`<option value="${esc(g.id)}">Replace: ${esc(g.title)}</option>`).join('');
 return `<details><summary style="cursor:pointer;font-weight:750;padding:10px 0">Manage shared artwork · Director</summary>
 <p class="note">Upload PNG, JPG or WebP (max 8 MB). Public artwork only: never upload credential QRs, private documents, or personal information.</p>
 <label>Graphic title<input id="hqAssetTitle" maxlength="120" placeholder="e.g. Court 2 · Harvest Crown"></label>
 <label>Library placement<select id="hqAssetSlot"><option value="new">Add new graphic</option>${slots}</select></label>
 <label>Image file<input type="file" id="hqAssetFile" accept="image/png,image/jpeg,image/webp"></label>
 <button class="btn primary" data-asset-upload="1" ${hqAssetBusy?'disabled':''}>Upload to Shared Library</button>
 <p class="note">Uploads are shared across events and survive Full Event Reset. If you replace a bundled image, removing the replacement restores the original.</p></details>`;
}
function hqSharedGraphicLibrary(){
 const card=g=>{
  const url=hqAssetArtwork(g.id);
  const art=url?`<img alt="${esc(g.title)}" src="${esc(url)}" loading="lazy" style="max-width:100%;height:180px;object-fit:contain;border-radius:10px;background:#111c2b">`:
   g.kind==='placeholder'?'<div class="hq-graphic-thumb hq-graphic-placeholder">ARTWORK<br>COMING SOON</div>':
   `<div class="hq-graphic-thumb">♛<small>${esc(g.kind==='court'?'COURT '+g.court:g.kind==='private'?'PRIVATE QR':'SCAN TO OPEN')}</small></div>`;
  const action=(g.kind==='placeholder'||g.kind==='art')&&!url?'<span class="mini">Placeholder · no file available</span>':
   g.kind==='private'?`<button class="btn primary" data-graphic-private="1">Choose Court & Print</button>`:
   `<button class="btn primary" data-graphic="${esc(g.id)}">Preview / Print</button>`;
  const uploaded=hqAssetById(g.id);
  const remove=uploaded&&hqAssetDirector()?`<button class="btn" data-asset-remove="${esc(g.id)}">Remove cloud artwork</button>`:'';
  return `<div class="tile hq-graphic-card">${art}<h3>${esc(uploaded?.title||g.title)}</h3><p class="note">${esc(uploaded?'Cloud artwork · shared across all tournaments':g.subtitle)}</p>${action}${remove}</div>`;
 };
 const base=HQ_GRAPHICS.map(g=>hqAssetById(g.id)?{...g,kind:'art'}:g);
 const extras=hqAssetRows.filter(r=>!HQ_GRAPHICS.some(g=>g.id===r.id)).map(r=>({id:r.id,kind:'art',title:r.title,subtitle:'Uploaded shared artwork'}));
 const cloudState=hqAssetError?`<p class="notice bad">${esc(hqAssetError)} · Bundled signs remain available.</p>`:hqAssetLoading?'<p class="note">Loading cloud artwork…</p>':!client?'<p class="note">Cloud is not connected. Bundled graphics and neutral templates remain available.</p>':'';
 return `<section class="panel" id="hqSharedGraphics"><h2>Event Graphics · Shared Library</h2>
 <p class="note">One graphics library for every tournament, including archived events. Neutral signs use <strong>${esc(S.title)}</strong> at print time; branded artwork retains its original wording.</p>
 ${cloudState}<button class="btn" data-asset-refresh="1">Refresh artwork</button>

function publicLink(kind){
 const u=new URL(location.origin+location.pathname);
 if(u.protocol!=='https:'){alert('Open Tournament HQ on its published HTTPS website before printing QR signs.');return null}
 u.search='';u.hash='';u.searchParams.set('mode',kind);
 if(hqViewingSelected()){
   if(!hqUuid(hqInspectedId)||!client||!session||cloudRole!=='director'||
      hqEventPreview?.id!==hqInspectedId||
      !['published','live','completed'].includes(hqEventPreview?.raw?.data?.status)){
     alert('Refresh the selected published event as Director before issuing public QR signs.');return null;
   }
   u.searchParams.set('event',hqInspectedId);
 }
 if(liveMode&&cloud?.url&&cloud?.key){
   // Only Supabase public/publishable client keys are eligible for spectator URLs.
   const k=cloud.key;
   let safe=k.startsWith('sb_publishable_');
   if(!safe){try{const part=k.split('.')[1];const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));safe=payload.role==='anon'}catch{safe=false}}
   if(!safe){alert('The configured Supabase key cannot be verified as a PUBLIC anon/publishable key. Do not print it in a QR. Configure a public key first.');return null}
   u.searchParams.set('sb_url',cloud.url);u.searchParams.set('sb_key',k);
 }else if(liveMode){alert('Cloud configuration is unavailable. Connect to Supabase before printing live-access QR signs.');return null}
 else if(!confirm('Cloud mode is disconnected. This QR opens the view, but a new device will not see live scores. Print anyway?'))return null;
 return u.href;
}

// These reports are stored in tournament state via the existing authorized hq_save RPC.

async function queueDirectorScore(m,sets){
 if(hqViewingSelected())return hqSubmitSelectedDirectorScore(m,sets);
 if(liveMode){
  if(!client||!session||cloudRole!=='director'){alert('Sign in with the Director account to submit scores.');return false}
  if(cloudBusy||cloudWriteInFlight||dirty){alert('Wait for Cloud to finish saving any earlier changes.');return false}
  try{
   const correction=isDone(m);
   if(correction){if(m.forfeitWinner){alert('Forfeit corrections require manual review.');return false}if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool result corrections after bracket generation require manual review.');return false}if(JSON.stringify(m.sets)===JSON.stringify(sets)){alert('No score changes entered.');return false}const test=copy(m);test.sets=copy(sets);if(winner(test)!==winner(m)){alert('Changing the match winner requires manual bracket reconciliation; no correction submitted.');return false}}
   const {data,error}=await client.rpc(correction?'hq_director_correction_submit':'hq_director_submit',{p_match:m.id,p_sets:sets,p_home:m.home,p_away:m.away});
   if(error)throw error;
   const check=await client.rpc('hq_pending');
   if(check.error){notice='Score SUBMITTED (receipt '+data+'), but approval queue refresh failed: '+check.error.message+'. Refresh Cloud before trying again; do not resubmit.';render();alert(notice);return true;}
   pending=(check.data||[]).map(x=>({...x,by:x.reporter_name,home:x.match_home,away:x.match_away}));
   notice=(correction?'Correction':'Score')+' received by Cloud and awaiting approval. Receipt: '+data;
   render();return true;
  }catch(e){notice='Director submission failed: '+(e.message||String(e));render();alert(notice);return false}
 }
 if(isDone(m)){alert('Final-result corrections require Live Mode and Director authentication.');return false;}
 if(S.reports.some(r=>r.status==='pending'&&r.matchId===m.id)){
  alert('A score is already waiting for approval for this match.');return false;
 }
 S.reports.push({id:uid(),matchId:m.id,home:m.home,away:m.away,by:'Director (local practice)',sets:copy(sets),at:new Date().toISOString(),status:'pending'});
 audit('Director local report submitted','Director',matchLabel(m));local();
 notice='Local practice report queued for approval.';render();return true;
}
async function decideDirectorReview(r,approve){
 if(liveMode&&(!session||cloudRole!=='director')){alert('Director authentication is required to approve this submission.');return}
 if(cloudWriteInFlight||cloudBusy){alert('Wait for cloud synchronization to finish.');return}
 const before=copy(S),prevDirty=dirty;
 const match=S.matches.find(x=>x.id===r.matchId);
 if(approve){
  if(!match||match.home!==r.home||match.away!==r.away){alert('Match participants have changed. Review or reject the submission.');return}
  const err=validSets(r.sets,match);if(err){alert(err);return}
  if(match.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool scores cannot be changed after creating playoffs without director reconciliation.');return}
  if(isDone(match)){alert('This match is already finalized. Review the duplicate submission.');return}
  if(!confirm('Approve Director-entered result for '+team(match.home)+' vs '+team(match.away)+'?'))return;
 }else if(!confirm('Reject this Director-entered score report?'))return;
 try{
  if(approve){match.sets=copy(r.sets);match.status='final';match.forfeitWinner=null;advanceBracket()}
  S.reports=S.reports.filter(x=>x.id!==r.id);
  audit(approve?'Director score approved':'Director score rejected',session?.user?.email||'Director',r.id);
  S.revision++;dirty=true;localStorage.setItem(KEY,JSON.stringify(S));
  if(liveMode){const ok=await pushCloud(true);if(!ok){S=before;dirty=prevDirty;localStorage.setItem(KEY,JSON.stringify(S));notice='Approval NOT saved to Cloud. Retry after checking connection.';render();return}}
  showCompleted=true;notice=approve?'Score approved and finalized.':'Score report rejected.';render();
 }catch(e){S=before;dirty=prevDirty;localStorage.setItem(KEY,JSON.stringify(S));alert('No approval was applied: '+(e?.message||e));render()}
}
async function applyScore(m,sets,by){
 const prior=copy(m.sets||[]);
 if(liveMode&&cloudRole!=='director'){
  alert('Director score entry requires a signed-in Director account. Assistants can approve referee-submitted score reports.');
  return false;
 }
 if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){
  alert('Pool result edits after generating the bracket could invalidate seeds. Export backup, then resolve bracket manually. This edit is blocked for safety.');return false;
 }
 if(m.stage==='playoff'&&m.round!==undefined){
  const downstream=S.matches.filter(x=>x.stage==='playoff'&&x.round>m.round&&isDone(x));
  if(downstream.length){alert('Correction blocked: downstream playoff results already exist. Export a backup and resolve the bracket with the tournament director before changing this score.');return false}
 }
 const previousState=copy(S);
 try{
  m.sets=copy(sets);m.forfeitWinner=null;m.status='final';
  advanceBracket();
  audit(prior.length?'Score corrected':'Score approved',by,`${team(m.home)} vs ${team(m.away)}; before ${JSON.stringify(prior)}; after ${JSON.stringify(sets)}`);
  // Persist locally, but never claim a successful LIVE save until Supabase confirms it.
  S.revision++;
  localStorage.setItem(KEY,JSON.stringify(S));
  dirty=true;
  if(liveMode){
   const confirmed=await pushCloud(true);
   if(!confirmed){
    notice='Score retained on this device but NOT confirmed in Cloud. Export a backup and retry after resolving the save error.';
    showCompleted=true;
    render();
    return false;
   }
   notice='Director score saved to Cloud successfully. Completed matches are shown below.';
  }else{
   notice='Director score saved in LOCAL practice only (not Cloud). Completed matches are shown below.';
  }
  showCompleted=true;
  render();
  return true;
 }catch(e){
  S=previousState;
  alert('Score was NOT saved. '+(e?.message||String(e))+' No tournament changes were applied.');
  render();
  return false;
 }
}

async function connectCloud(){const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co$/.test(url)||!key){alert('Enter a valid Supabase project URL and publishable key');return}cloud={url,key};sessionStorage.removeItem('hc-v4-practice-only');localStorage.setItem(CONFIG,JSON.stringify(cloud));await initCloud()}
async function initCloud(){
 if(!cloud?.url||!cloud?.key){if(hqPublicTarget){hqPublicError='Public cloud configuration is missing; open a newly issued event QR link.';render();}return;}
 try{
   await sdk();client=window.supabase.createClient(cloud.url,cloud.key);
   const authClient=client;
   session=(await client.auth.getSession()).data.session;
   client.auth.onAuthStateChange((_ev,next)=>{
     session=next;
     // Avoid calling Supabase RPCs inside the auth callback's internal lock.
     setTimeout(async()=>{
       if(client!==authClient)return;
       await hqRefreshAccountRole();
       if(!hqCredentialTarget){
         if(!hqViewingSelected())await pullCloud(false);
         if(session&&cloudRole==='director'&&mode==='director')await hqCatalogReload();
       }
     },0);
   });
   liveMode=true;sync='Connecting…';
   if(hqPublicTarget){
     if(!hqPublicTimer)hqPublicTimer=setInterval(()=>{void hqLoadScopedPublic()},15000);
     await hqLoadScopedPublic();
     return;
   }
   if((courtSecret||refSecret)&&hqCredentialTarget){
     try{await hqInitializeScopedCredential()}
     catch(err){hqCredentialVerified=false;courtValid=false;hqCredentialEventId='';
       mode='referee';tab='submit';S=defaults();S.matches=[];
       sync='Credential blocked: '+(err?.message||String(err));notice=sync;
     }
     render();return;
   }
   await pullCloud(false);
   await hqRefreshAccountRole();
   if(session&&cloudRole==='director'&&mode==='director')await hqCatalogReload();
   if(courtSecret){const {data,error}=await client.rpc('hq_court_identity',{p_secret:courtSecret,p_court:courtIndex});courtValid=!error&&data===true;mode='referee';tab='submit';if(!courtValid)sync='Court QR expired or invalid';}
   if(refSecret){const {data,error}=await client.rpc('hq_ref_identity',{p_secret:refSecret});if(error||!data){sync='Invalid or revoked referee link';mode='display'}else{cloudRefName=data;let matching=S.refs.find(x=>x.name===data);let teamMatch=S.teams.find(x=>x.name===data);if(matching)selectedRef=matching.id;else if(teamMatch)selectedRef='team:'+teamMatch.id;mode='referee';tab='submit'}}
   await pollReports();if(tab==='rosters')await rosterLoad();
   if(tab==='connections'||tab==='registrations'){await connectionLoad();await teamRegLoad();await rosterLoad()}
   if(!window.hqTimer)window.hqTimer=setInterval(async()=>{if(!dirty)await pullCloud(false);if(mode==='director')await pollReports()},5000);
   render();
 }catch(e){sync='Cloud unavailable: '+e.message;liveMode=false;render()}
}
async function pullCloud(force){if(hqPublicTarget||!client||hqViewingSelected())return;if((dirty||cloudWriteInFlight)&&!force){sync='Local changes awaiting cloud save; do not overwrite';return}try{const {data,error}=await client.rpc('hq_view');if(error)throw error;if(hqViewingSelected())return;if(data?.data?.schema===2){if(dirty&&!force)return;S=data.data;S.version=Number(data.version||0);localStorage.setItem(KEY,JSON.stringify(S));dirty=false;lastSyncAt=Date.now();sync='Live cloud synced · version '+S.version;render()}else{sync='No published cloud tournament. Authorized director can publish practice data.';render()}}catch(e){sync='Cloud sync error: '+e.message;render()}}
async function pushCloud(force=false){if(hqViewingSelected())throw Error('Event-specific write routes not yet enabled');
 if(!client||!session||cloudRole!=='director'){note('Only an authorized director can publish');return false}
 if(cloudWriteInFlight){cloudWriteAgain=true;return false}
 if(!dirty&&!force)return true;
 cloudWriteInFlight=true;
 let ok=true;
 try{
  do{
   cloudWriteAgain=false;
   const snapshot=copy(S),revisionAtStart=S.revision;
   const {data,error}=await client.rpc('hq_save',{p_data:snapshot,p_expected:snapshot.version||0});
   if(error)throw error;
   S.version=data;
   const newEdits=S.revision!==revisionAtStart;
   dirty=newEdits;
   localStorage.setItem(KEY,JSON.stringify(S));
   lastSyncAt=Date.now();sync=newEdits?'Cloud saved earlier changes; newer edits pending':'Cloud saved · version '+data;
   if(newEdits)cloudWriteAgain=true;
  }while(cloudWriteAgain);
  render();
 }catch(e){ok=false;sync='NOT saved: '+e.message+'. Export backup before reloading.';render();alert('Director changes were NOT saved to cloud: '+e.message+'\nExport a backup before reloading.')}
 finally{cloudWriteInFlight=false}
 return ok;
}

async function hqListEventTokens(filterType='',filterCourt=null){
 if(!hqViewingSelected()||!client||!session||cloudRole!=='director')return;
 const eventId=hqInspectedId;
 if(hqTokenListBusy)return;

  const {data,error}=await client.rpc('hq_multi_token_list',{p_event_id:eventId});
  if(error)throw error;

  if(!Array.isArray(data))throw Error('Token listing returned an unexpected response');
  const rows=data.filter(t=>t&&t.active===true&&['referee','court'].includes(t.kind) &&
    (!filterType||t.kind===filterType) && (filterCourt===null||Number(t.court_index)===Number(filterCourt)));
  const target=$('hqTokenListing');
  if(!target)return;
  target.className='notice';
  if(!rows.length){target.textContent='No active '+(filterType||'event')+' credentials found for this event.';return}
  target.innerHTML='<strong>'+rows.length+' active credential(s) · '+esc(S.title)+'</strong>'+rows.map(t=>{
   const label=t.kind==='court'?'Court '+(Number(t.court_index)+1):String(t.name||'Referee');
   return '<div class="tile" style="margin-top:8px"><strong>'+esc(label)+'</strong><p class="mini">'+esc(t.kind)+' · ID '+esc(t.id)+' · Issued '+esc(t.created_at||'unknown')+'</p><button class="btn danger" data-hqrevoke="'+esc(t.id)+'" data-hqkind="'+esc(t.kind)+'" data-hqcourt="'+esc(String(t.court_index??''))+'">Revoke this credential</button></div>';
  }).join('');
 }catch(err){const target=$('hqTokenListing');if(target){target.className='notice bad';target.textContent='Credential list unavailable: '+(err.message||String(err))+' (no credentials modified)';}}
 finally{hqTokenListBusy=false;}
}
async function hqRevokeEventToken(button){
 if(!hqViewingSelected()||cloudRole!=='director'||!session||!client)return;
 const eventId=hqInspectedId,id=button.dataset.hqrevoke,kind=button.dataset.hqkind;
 if(!hqUuid(id)||!['referee','court'].includes(kind))return alert('Invalid credential selection');
 if(!confirm('Revoke this '+kind+' credential for '+S.title+'? It will stop working immediately. This cannot be undone.'))return;
 button.disabled=true;
 const rpc=kind==='court'?'hq_multi_revoke_court_token':'hq_multi_revoke_ref_token';
 const arg=kind==='court'?'p_token_id':'p_token_id';
 try{
  const {data,error}=await client.rpc(rpc,{p_event_id:eventId,[arg]:id});
  if(error)throw error;
  if(data!==true)throw Error('Backend did not confirm revocation. Refresh before retrying.');
  if(hqInspectedId===eventId){
   if(kind==='court'){
    const c=Number(button.dataset.hqcourt),cacheKey=eventId+':'+c;
    // Old browser-scoped court QR could point at the revoked credential.
    // Clear it conservatively; the Director can issue a new QR.
    delete courtTokenCache[cacheKey];
    sessionStorage.setItem('hc-v5-court-tokens',JSON.stringify(courtTokenCache));
   }
   await hqListEventTokens();
   note('Credential revoked for '+S.title+'. Reprint any affected QR packet.');
  }
 }catch(err){alert('Revocation NOT confirmed: '+(err.message||String(err))+' — refresh before retrying.');}
 finally{button.disabled=false;}
}
// The original Print & Reports tab is shared. Only local document output is
// permitted here; scoped public QR pages need separate view routing checks.
document.addEventListener('click',e=>{
 const btn=e.target.closest?.('#hqTokensRefresh,[data-hqrevoke]');
 if(!btn||btn.disabled||!hqViewingSelected())return;
 e.preventDefault();e.stopImmediatePropagation();
 if(btn.id==='hqTokensRefresh')void hqListEventTokens();
 else void hqRevokeEventToken(btn);
},true);

// Shared print action dispatcher: one delegated listener survives view re-renders.
// Capture keeps printing available if an unrelated binding fails.
document.addEventListener('click',function printActions(e){
 const b=e.target.closest('[data-print],[data-doc],[data-courtprint],[data-publicqr],[data-graphic],[data-graphic-private],[data-asset-upload],[data-asset-remove],[data-asset-refresh]');
 if(!b)return;
 if(b.disabled)return;
 e.preventDefault();e.stopImmediatePropagation();
 // Preserve print operations and report failures without a developer-only UI.
 const show=(msg,bad=false)=>{if(bad)alert(msg)};
 try{
  if(b.hasAttribute('data-asset-refresh')){void hqAssetsLoad(true);return;}
  if(b.hasAttribute('data-asset-upload')){void hqAssetUpload();return;}
  if(b.hasAttribute('data-asset-remove')){void hqAssetRemove(b.getAttribute('data-asset-remove'));return;}
  if(b.hasAttribute('data-graphic')){hqPrintSharedGraphic(b.getAttribute('data-graphic'));return;}
  if(b.hasAttribute('data-graphic-private')){hqPrintPrivateCourtSign();return;}
  if(b.hasAttribute('data-publicqr')){publicSign(b.getAttribute('data-publicqr'));return;}
  if(b.dataset.print){show('Opening '+b.dataset.print+' preview…');printDoc(b.dataset.print);return;}
  if(b.dataset.doc){show('Preparing '+b.dataset.doc+' download…');docDownload(b.dataset.doc);return;}
  if(b.dataset.courtprint!==undefined){show('Preparing court packet…');printCourt(Number(b.dataset.courtprint));return;}
 }catch(err){show('Print error: '+(err&&err.message||String(err)),true);console.error('Tournament HQ printing failure',err)}
},true);
window.addEventListener('storage',e=>{if(e.key===KEY&&!dirty){S=load();render()}});setInterval(()=>{if(mode==='display'){displaySlide++;render()}},15000);if(cloud&&sessionStorage.getItem('hc-v4-practice-only')!=='1')initCloud();render();
