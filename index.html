let groups=sizes.map((_,i)=>[]);for(let i=0;i<sorted.length;i++){let eligible=groups.map((g,k)=>({k,count:g.length,max:sizes[k]})).filter(x=>x.count<x.max);let k=eligible.find(x=>x.k===i%sizes.length)?.k??eligible[0].k;groups[k].push(sorted[i])}groups.forEach((g,k)=>g.forEach(t=>S.teams.find(x=>x.id===t.id).pool=String.fromCharCode(65+k)));
let remaining=groups.flatMap((g,k)=>makePoolPairs(g,String.fromCharCode(65+k))),created=[],slots=[],time=minutes(S.settings.start),step=S.settings.minutes+S.settings.breakMinutes,rest=S.settings.rest;let rounds=0;
while(remaining.length&&rounds++<500){let used=new Set(),pick=[];for(let c=0;c<S.settings.courts;c++){let candidates=remaining.filter(m=>!used.has(m.home)&&!used.has(m.away)&&created.every(prev=>!(prev.home===m.home||prev.away===m.home||prev.home===m.away||prev.away===m.away)||time>=prev.start+step+rest));candidates.sort((a,b)=>{const xa=created.filter(v=>v.home===a.home||v.away===a.home||v.home===a.away||v.away===a.away).length,xb=created.filter(v=>v.home===b.home||v.away===b.home||v.home===b.away||v.away===b.away).length;return xa-xb||a.pool.localeCompare(b.pool)});let m=candidates[0];if(m){m.court=c;m.start=time;m.slot=`${fmt(time)}`;pick.push(m);used.add(m.home);used.add(m.away);remaining=remaining.filter(x=>x!==m);created.push(m)}}if(pick.length)slots.push(pick);time+=step}if(remaining.length){note('Unable to schedule all pool matches using the requested rest settings. Try reducing rest minutes.');return}if(time>minutes(S.settings.end))note('Schedule exceeds desired tournament end time; adjust match duration/rest or format before publishing.');S.matches=created.sort((a,b)=>a.start-b.start||a.court-b.court);S.reports=[];S.audit=[];S.status='draft';autoAssign();local()}
function bracketSize(){return Math.min(S.settings.playoff,S.teams.length)}function seeded(){const groups=pools().map(p=>standings(p));let out=[];for(let r=0;out.length<S.teams.length;r++){for(const group of groups)if(group[r])out.push(group[r].id)}return out}

function eliminatedTeams(){const out=new Set();for(const m of S.matches.filter(x=>x.stage==='playoff'&&isDone(x))){const loser=winner(m)===m.home?m.away:m.home;if(loser)out.add(loser)}return out}
function cleanEliminatedDuties(){const gone=eliminatedTeams();let changed=0;for(const m of S.matches.filter(x=>x.stage==='playoff'&&!isDone(x))){if(m.started)continue;const concurrent=S.matches.filter(x=>x!==m&&overlaps(x,m));const busy=new Set([m.home,m.away,...concurrent.flatMap(x=>[x.home,x.away])].filter(Boolean));const refTeam=m.official?.startsWith('team:')?m.official.slice(5):null;if(refTeam&&(gone.has(refTeam)||busy.has(refTeam))){m.official='';changed++}if(m.lineTeam&&(gone.has(m.lineTeam)||busy.has(m.lineTeam))){m.lineTeam='';changed++}}return changed}
function assignBracketOfficials(){
 const games=S.matches.filter(m=>m.stage==='playoff'&&!isDone(m)&&!m.started&&m.home&&m.away&&!m.autoWinner).sort((a,b)=>a.start-b.start||a.court-b.court);
 const mode=S.settings.bracketOfficialMode||'dedicated',lineMode=S.settings.bracketLineMode||'active';const gone=eliminatedTeams();let changed=0;
 for(const m of games){const simultaneous=S.matches.filter(x=>x!==m&&overlaps(x,m));const playing=new Set([m.home,m.away,...simultaneous.flatMap(x=>[x.home,x.away])].filter(Boolean));const eligible=S.teams.filter(t=>!playing.has(t.id)&&!gone.has(t.id)).sort((a,b)=>{let count=id=>S.matches.filter(x=>x.stage==='playoff'&&(x.lineTeam===id||x.official==='team:'+id)).length;return count(a.id)-count(b.id)});
 if(!m.official){if(mode!=='teams'){const ref=S.refs.find(r=>!simultaneous.some(x=>x.official===r.id));if(ref){m.official=ref.id;changed++}}if(!m.official&&mode!=='dedicated'){const t=eligible.find(t=>!simultaneous.some(x=>x.lineTeam===t.id||x.official==='team:'+t.id));if(t){m.official='team:'+t.id;changed++}}}
 if(lineMode==='none'||lineMode==='dedicated')continue;
 if(!m.lineTeam){const t=eligible.find(t=>!simultaneous.some(x=>x.lineTeam===t.id||x.official==='team:'+t.id));if(t){m.lineTeam=t.id;changed++}}
 }

function bracketStaffingNotes(){const gone=eliminatedTeams();return S.matches.filter(m=>m.stage==='playoff'&&!isDone(m)).flatMap(m=>{let notes=[];if(!m.home||!m.away)return notes;if(!m.official)notes.push(matchLabel(m)+': referee needed');if((S.settings.bracketLineMode==='active'||S.settings.bracketLineMode==='all')&&!m.lineTeam)notes.push(matchLabel(m)+': line judges needed (active and nonplaying teams may be unavailable)');if(m.lineTeam&&gone.has(m.lineTeam))notes.push(matchLabel(m)+': eliminated team still assigned as line judges');return notes})}

function generatePlayoff(){if(!allPoolsDone()){alert('All pool scores must be approved first.');return}if(S.matches.some(m=>m.stage!=='pool')){alert('Playoffs already created.');return}let ids=seeded().slice(0,bracketSize()),pow=2**Math.ceil(Math.log2(ids.length));let slots=Array(pow).fill(null);slots[0]=ids[0];const seedOrder=n=>{let a=[1,2];while(a.length<n){let size=a.length*2;a=a.flatMap(v=>[v,size+1-v])}return a};let positions=seedOrder(pow);ids.forEach((id,i)=>slots[positions.indexOf(i+1)]=id);let rounds=[],current=slots;while(current.length>1){rounds.push(current);current=Array(current.length/2).fill(null)}let base=Math.max(...S.matches.map(m=>m.start+matchDuration(m)+S.settings.breakMinutes),minutes(S.settings.start));let stageCount=rounds.length;let roundStart=base;for(let r=0;r<stageCount;r++){for(let i=0;i<rounds[r].length/2;i++){const home=rounds[r][2*i]||null,away=rounds[r][2*i+1]||null;S.matches.push({id:uid(),stage:'playoff',round:r,index:i,pool:'',home,away,sets:[],court:i%S.settings.courts,start:roundStart+Math.floor(i/S.settings.courts)*(S.settings.playoffMinutes+S.settings.breakMinutes),slot:`Round ${r+1}`,official:'',lineTeam:'',status:'scheduled'})}roundStart+=Math.ceil((rounds[r].length/2)/S.settings.courts)*(S.settings.playoffMinutes+S.settings.breakMinutes)+S.settings.rest}advanceBracket();assignBracketOfficials();local()}
function advanceBracket(){let m=S.matches.filter(x=>x.stage==='playoff');const rounds=[...new Set(m.map(x=>x.round))].sort((a,b)=>a-b);for(let r of rounds){const cur=m.filter(x=>x.round===r).sort((a,b)=>a.index-b.index);for(const game of cur){if(game.home&&!game.away&&r===0){game.autoWinner=game.home}else game.autoWinner=null;let target=m.find(x=>x.round===r+1&&x.index===Math.floor(game.index/2));if(!target)continue;let advance=winner(game)||game.autoWinner||null;let prop=game.index%2===0?'home':'away';if(target[prop]!==advance){if(isDone(target)||target.started){throw new Error('Bracket advancement blocked: a downstream match is already started or final. Resolve this with the director before changing participants.')}target[prop]=advance;target.sets=[];target.forfeitWinner=null}}}cleanEliminatedDuties();assignBracketOfficials();}
function validate(){let issues=[],a=S.matches,step=S.settings.minutes+S.settings.breakMinutes,rest=S.settings.rest;const issue=(level,msg)=>issues.push({level,msg});if(S.teams.length<4||S.teams.length>12)issue('error','Tournament requires 4–12 teams.');if(S.settings.courts<1||S.settings.courts>8)issue('error','Use 1–8 courts.');if(!a.length)issue('warn','Generate a schedule first.');for(let i=0;i<a.length;i++){let x=a[i];if(x.court<0||x.court>=S.settings.courts)issue('error',`${x.slot}: court does not exist.`);if(x.start+matchDuration(x)>minutes(S.settings.end))issue('error',`${matchLabel(x)} exceeds tournament end time.`);if(x.home&&x.away&&x.home===x.away)issue('error',`${matchLabel(x)} pits a team against itself.`);if(x.official?.startsWith('team:')){let t=x.official.slice(5);if(t===x.home||t===x.away)issue('error',`${matchLabel(x)} has a playing team assigned to officiate.`)}if(x.lineTeam&&(x.lineTeam===x.home||x.lineTeam===x.away))issue('error',`${matchLabel(x)} assigns line judging to a playing team.`);for(let j=0;j<i;j++){let y=a[j];if(Math.max(x.start,y.start)>=Math.min(x.start+matchDuration(x)+S.settings.breakMinutes,y.start+matchDuration(y)+S.settings.breakMinutes))continue;if(x.court===y.court)issue('error',`${matchLabel(x)} and ${matchLabel(y)} overlap on the same court.`);for(let t of [x.home,x.away].filter(Boolean))if(t===y.home||t===y.away)issue('error',`${team(t)} is double-booked in ${matchLabel(x)} and ${matchLabel(y)}.`);for(let t of [x.home,x.away].filter(Boolean)){if(y.official===`team:${t}`||y.lineTeam===t)issue('error',`${team(t)} is playing and officiating simultaneously.`)}for(let t of [y.home,y.away].filter(Boolean)){if(x.official===`team:${t}`||x.lineTeam===t)issue('error',`${team(t)} is playing and officiating simultaneously.`)}if(x.official&&x.official===y.official&&!x.official.startsWith('team:'))issue('error',`One referee assignment overlaps in ${matchLabel(x)} and ${matchLabel(y)}.`)}for(const t of S.teams){if(x.official==='team:'+t.i function lifecycleControls(){
 const errors=validate().filter(x=>x.level==='error'),warnings=validate().filter(x=>x.level==='warn');
 const ready=S.matches.length>0&&!errors.length;
 const stage=S.status==='draft'&&ready?'Ready to publish':S.status;
 const cloudNote=liveMode?`Cloud: ${esc(sync)} · ${esc(cloudRole)}`:'Local practice (not shared across devices)';
 return `<div class="notice ${errors.length?'bad':ready?'good':''}"><strong>Current stage: ${esc(stage)}</strong><br>${S.matches.length} scheduled matches · ${errors.length} critical errors · ${warnings.length} warnings<br><small>${cloudNote}</small></div>
 <p class="note">Draft and validation are automatic. Publishing shares the schedule with captains and spectators; starting the tournament activates match-day operation.</p>
 <div class="actions">${S.status==='draft'||S.status==='validated'?`<button class="btn primary" id="publishSchedule" ${!ready?'disabled':''}>✓ Publish Schedule</button>`:''}
 ${S.status==='published'?'<button class="btn primary" id="startTournament">▶ Start Tournament</button>':''}
 ${S.status==='live'?'<button class="btn primary" id="finishTournament">★ Finish Tournament</button>':''}
 ${['published','live'].includes(S.status)?'<button class="btn" id="openRun">Open Run Tournament →</button>':''}
 ${['published','live'].includes(S.status)?'<button class="btn" id="reviseSchedule">↻ Revise Schedule</button>':''}
 ${S.status==='completed'?'<div class="notice good">Tournament completed. Results are retained.</div>':''}</div>
 ${!ready?'<p class="note">Generate a schedule and resolve critical Safety issues to enable publication.</p>':''}
 ${warnings.length?'<p class="note">Staffing/rest warnings remain. Review Safety before publishing.</p>':''}`;
}
async function changeLifecycle(target){
 if(mode!=='director'||(liveMode&&cloudRole!=='director')){alert('Director access required.');return}
 if(target==='draft'){
  if(!['published','live'].includes(S.status)){alert('Schedule is already editable.');return}
  if(S.matches.some(isDone)||S.reports.some(r=>r.status==='pending')||pending.some(r=>r.status==='pending')){
   alert('Schedule regeneration is disabled because completed matches or pending score reports exist. Use Quick Fix for individual changes, or export a backup and contact an administrator for a controlled reset.');return;
  }
  if(!confirm('Reopen schedule editing? This temporarily returns the tournament to Draft. Previously published viewers may see the existing schedule until you publish the revision. Re-publish once all changes pass Safety.'))return;
 }else if(target==='published'){
  if(!S.matches.length||validate().some(x=>x.level==='error')){alert('Generate a schedule and resolve critical Safety errors first.');tab='safety';render();return}
  if(S.status!=='draft'&&S.status!=='validated'){alert('Tournament has already been published.');return}
  if(!confirm(`Publish ${S.matches.length} matches? ${validate().filter(x=>x.level==='warn').length} warnings remain. Public viewers will be able to see the schedule.`))return;
 }else if(target==='live'){
  if(S.status!=='published'){alert('Publish the schedule first.');return}
  if(!confirm('Start tournament operations now?'))return;
 }else if(target==='completed'){
  if(S.status!=='live')return;
  if(S.matches.some(m=>m.stage==='playoff'&&!isDone(m)&&m.home&&m.away)){alert('Finalize all played playoff matches before finishing.');return}
  if(!confirm('Finish tournament and preserve results?'))return;
 }
 const prior=S.status;S.status=target;audit('Stage changed','Director',target);
 if(liveMode){
  if(!client||!session){S.status=prior;alert('Cloud is disconnected. No changes published.');return}
  dirty=true;
  const ok=await pushCloud(true);
  if(!ok){S.status=prior;dirty=true;alert('Cloud publication failed. Status was not advanced. Check Cloud and retry.');return}
  dirty=false;notice=target==='draft'?'Schedule reopened for editing. Generate your revision, check Safety, then publish again.':target==='published'?'Schedule published to cloud. Captain and spectator views can now see it.':target==='live'?'Tournament is live. Open Run Tournament.':'Tournament completed and saved.';
 }else{local();notice='Local practice stage updated; not visible on other devices.'}
 if(target==='live')tab='home';render();
}

function helpForIssue(msg){
if(msg.includes('no assigned referee'))return ['No eligible official was available in that time slot under the current staffing and match schedule.','Open Officials to assign an available referee, change staffing mode, or move the match to a free time slot.','assignments'];
if(msg.includes('no line judges assigned'))return ['No available nonplaying team was assigned to cover the line judging duty.','Check both courts at that time. Assign a free team in Officials, supply separate line judges, or move this match.','assignments'];
if(msg.includes('concurrent matches'))return ['One team is assigned to officiate two overlapping matches.','Reassign one duty to another free team or adjust one match time.','assignments'];
if(msg.includes('minutes between'))return ['The team has less than the requested rest period between matches.','Try moving the later match to a free slot in Quick Fix.','quick'];
if(msg.includes('overlap')||msg.includes('double-booked')||msg.includes('simultaneously'))return ['Two commitments overlap, so both cannot be fulfilled as scheduled.','Use Quick Fix to change a time, court, or referee, then rerun validation.','quick'];
if(msg.includes('end time'))return ['The allotted match time would finish after the configured end of the tournament.','Shorten the format or match duration, extend the event window, or shift a match earlier.','setup'];
return ['This check detected an issue that may require director review.','Review the matches and assignments involved; rerun safety checks after making changes.','matches'];
}
function safety(){let issues=validate(),err=issues.filter(x=>x.level==='error');return `<div class="panel"><h2>Schedule Health Check</h2><div class="notice ${err.length?'bad':'good'}">${err.length?err.length+' critical errors: do not publish.':'No critical conflicts found.'} ${issues.filter(x=>x.level==='warn').length} warnings.</div><button class="btn primary" id="runValidation">Run Checks Again</button>${issues.map(x=>{const [why,fix,page]=helpForIssue(x.msg);return `<div class="notice ${x.level==='error'?'bad':''}"><strong>${x.level==='error'?'⛔ Critical':'⚠️ Warning'}: ${esc(x.msg)}</strong><p class="note"><strong>Why:</strong> ${esc(why)}</p><p class="note"><strong>Try:</strong> ${esc(fix)}</p><button class="btn" data-tab="${page}">Open ${page==='quick'?'Quick Fix':page==='assignments'?'Officials':page==='setup'?'Setup':'Matches'} →</button></div>`}).join('')||'<p class="note">All basic scheduling checks passed.</p>'}<p class="note">Important: bracket opponents depend on pool results. Recheck after advancement; playoff assignments and start times are provisional until participants are determined.</p></div><div class="panel"><h2>Event-day Readiness</h2><p class="note">Review before opening doors: published schedule, tested court QR codes, referees, line judges, printed court packets and backup sheets.</p>${S.matches.length?"<div class=\"notice good\">Schedule generated</div>":"<div class=\"notice\">Schedule not generated</div>"}${bracketStaffingNotes().map(x=>`<div class="notice">${esc(x)}</div>`).join('')}</div><div class="panel"><h2>Export & Recovery</h2><button class="btn primary" data-tab="prints">🖨 Print & Reports Center</button><div class="actions"><button class="btn" id="export">Download Backup JSON</button><button class="btn" id="exportCsv">Download Schedule CSV</button><button class="btn ghost" id="import">Restore Backup</button></div><input type="file" id="file" accept="application/json" style="display:none"><p class="note">Download and retain a backup function cloudPage(){return `<div class="panel"><h2>Cloud & Live Mode</h2><div class="notice ${liveMode&&lastSyncAt?'good':''}">${esc(sync)}</div><p class="note">Practice remains on this device until Live Mode is activated. Cloud configuration uses the included cloud.sql file. Only use a dedicated Supabase project; never paste the service-role key.</p><label class="field"><span>Supabase project URL</span><input id="url" placeholder="https://project.supabase.co" value="${esc(cloud?.url||'')}"></label><label class="field"><span>Supabase publishable / anon key</span><input id="key" value="${esc(cloud?.key||'')}"></label><button class="btn primary" id="connect">Connect & Enable Live</button>${liveMode?`<button class="btn ghost" id="disconnectCloud" style="margin-left:8px">Return to Local Practice</button>`:''}${liveMode?`<div class="notice">Account role: ${esc(cloudRole)} · ${esc(session?.user?.email||'not signed in')}. Public screens only see published data.</div>${session?`<div class="actions"><button class="btn" id="pull">Reload Cloud</button>${cloudRole==='director'?'<button class="btn primary" id="push">Publish Practice Data</button><button class="btn" id="makeLink">Create Referee Link</button><button class="btn danger" id="revokeLink">Revoke Referee Links</button><button class="btn danger" id="resetCloudTests">Reset Test Results</button>':''}<button class="btn" id="logout">Sign Out</button></div>`:`<label class="field"><span>Director / assistant email</span><input type="email" id="email" placeholder="authorized@email.com"></label><button class="btn" id="login">Send Sign-In Link</button>`}<div class="notice">Referees: use the secure links created by the director. Spectator URL: ${esc(location.origin+location.pathname+'?mode=display')}.</div>`:''}<p class="note">Tip: publish a validated schedule before distributing referee links. Always test the cloud roles with separate devices and check data sync after every approval.</p></div>`}
function pendingCount(){return [...S.reports,...pending].filter(x=>x.status==='pending').length}function reportQueue(){const list=[...S.reports,...pending].filter(x=>x.status==='pending');return `<div class="panel"><h2>Score Approval Queue (${list.length})</h2>${list.map(r=>`<div class="tile"><strong>${esc(team(r.home))} vs ${esc(team(r.away))}</strong><p class="note">${esc(r.by)} · ${esc(r.sets.map(x=>x.join('–')).join(' / '))}</p><div class="actions"><button class="btn primary" data-approve="${esc(r.id)}">Approve</button><button class="btn danger" data-reject="${esc(r.id)}">Reject</button></div></div>`).join('')||'<p class="note">No scores awaiting review.</p>'}</div>`}

const saved=localStorage.getItem('hc-v4-captain-team')||'';
const selected=S.teams.some(t=>t.id===saved)?saved:(S.teams[0]?.id||'');
const activities=S.matches.filter(m=>m.home===selected||m.away===selected||m.official==='team:'+selected||m.lineTeam===selected).sort((a,b)=>a.start-b.start);

function courtDoc(c){const ms=S.matches.filter(m=>m.court===c).sort((a,b)=>a.start-b.start);let html=`<section>${docHeader((S.courts[c]||'Court '+(c+1))+' · Scorekeeping Folder')}<p>Scan this private court QR after every match. Enter final scores and your name, then submit for director approval.</p><div id="qr-target" class="qr"></div><p><strong>COURT ${c+1}</strong> · Keep this sheet with your score sheets.</p>${rowTable(['Match','Time','Teams','Crew'],ms.map(m=>[matchLabel(m),fmt(m.start),team(m.home)+' vs '+team(m.away),m.official?official(m.official):'Pending']))}</section>`;for(const m of ms){html+=`<section>${docHeader((S.courts[c]||'Court '+(c+1))+' · Match Score Sheet')}<p><strong>${esc(matchLabel(m))}</strong> · ${fmt(m.start)} · ${esc(m.stage==='pool'?'Pool '+m.pool:'Playoffs')}</p><h2>${esc(team(m.home))} vs ${esc(team(m.away))}</h2>${rowTable(['Set',team(m.home),team(m.away)],Array.from({length:2*S.settings.setsToWin-1},(_,i)=>[i+1,'________________','________________']))}<p>Winner: ______________________________</p><p>Referee / scorekeeper: ______________________________</p><p>Notes: _____________________________________________</p><div class="box">When finished, scan the Court ${c+1} QR on the folder cover sheet. Submit scores and retain this paper copy.</div></section>`}return html}

function openPrint(html,qr){
 // Keep print preview inside the app: no pop-up permissions or automatic print dialogs.
 document.getElementById('printPreviewOverlay')?.remove();
 const overlay=document.createElement('div');
 overlay.id='printPreviewOverlay';
 overlay.style.cssText='position:fixed;inset:0;z-index:100000;background:#e9edf3;display:flex;flex-direction:column;';
 const tools=document.createElement('div');
 tools.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#132a4b;color:white;';
 const label=document.createElement('strong');label.textContent='SOVEREIGN SPORTS · Document Preview';label.style.cssText='margin-right:auto;';
 const status=document.createElement('span');status.style.cssText='font-size:12px;color:#f0bd35';status.textContent=qr?'Preparing court QR…':'Preview ready';
 const printButton=document.createElement('button');printButton.textContent='Print / Save PDF';printButton.className='btn primary';printButton.disabled=!!qr;
 const closeButton=document.createElement('button');closeButton.textContent='Close Preview';closeButton.className='btn';
 tools.append(label,status,printButton,closeButton);
 const frame=document.createElement('iframe');frame.title='Sovereign Sports print preview';frame.style.cssText='border:0;width:100%;flex:1;background:white;';
 overlay.append(tools,frame);document.body.appendChild(overlay);
 closeButton.onclick=()=>overlay.remove();
 printButton.onclick=()=>{try{frame.contentWindow.focus();frame.contentWindow.print()}catch(e){alert('Print failed: '+e.message+' . Try the Download DOC option instead.')}};
 const doc=frame.contentDocument;doc.open();doc.write(htmlDoc(html));doc.close();
 if(qr){
   const qrTarget=doc.getElementById('qr-target');
   if(!qrTarget){status.textContent='QR target missing';return}
   const script=doc.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
   script.onload=()=>{try{new frame.contentWindow.QRCode(qrTarget,{text:qr,width:205,height:205,correctLevel:frame.contentWindow.QRCode.CorrectLevel.M});status.textContent='QR ready · Verify it scans before printing';printButton.disabled=false}catch(e){status.textContent='QR error: '+e.message}};
   script.onerror=()=>{status.textContent='QR library unavailable · Check connection';qrTarget.textContent='Cannot print: QR not generated.';};
   doc.head.appendChild(script);
 }
}

function audit(action,by,detail){S.audit.push({id:uid(),action,by,detail,at:new Date().toISOString()})}
function validSets(v,m){const rules=matchRules(m);if(!v.length||v.length>3)return 'Wrong number of sets';let a=0,b=0;for(let si=0;si<v.length;si++){const st=v[si];if(st.length!==2||st.some(x=>!Number.isInteger(x)||x<0||x>99)||st[0]===st[1])return 'Each played set needs two different whole-number scores';const high=Math.max(...st),low=Math.min(...st),target=si===2?rules.decider:rules.target,cap=rules.cap; if(high<target)return 'Set '+(si+1)+' has not reached '+target+' points'; if(cap>0&&high>cap)return 'Set '+(si+1)+' exceeds the '+cap+' point cap';if(high-low<2 && !(cap>0&&high===cap))return 'Set '+(si+1)+' must be won by two until the cap';if(st[0]>st[1])a++;else b++;if(a===2||b===2){if(si!==v.length-1)return 'Do not enter sets after the match is won'}}if(Math.max(a,b)!==2)return 'One team must win the required sets';return ''}
function scoreModal(id,refMode=false){const reporter=(courtSecret?($('courtReporter')?.value||'').trim():liveMode&&refSecret?cloudRefName:([...(S.refs||[]).map(r=>({id:r.id,name:r.name})),...(S.teams||[]).map(t=>({id:'team:'+t.id,name:t.name}))].find(x=>x.id===selectedRef)?.name))||'Referee';let m=S.matches.find(x=>x.id===id);if(!m||!m.home||!m.away)return;if(courtSecret&&!reporter){alert('Please enter your name before reporting a score.');return}let sets=m.sets||[];const count=3;const scoring=matchRules(m);let dom=document.createElement('div');dom.className='modalcover';dom.innerHTML=`<div class="modal"><h2>${refMode?'Report':'Edit'} Result</h2><p class="note">${esc(team(m.home))} vs ${esc(team(m.away))} · ${esc(matchLabel(m))}<br>Best of 3 · sets to ${scoring.target}${scoring.cap?' · cap '+scoring.cap:''}${m.stage==='playoff'?' · deciding set to '+scoring.decider:''}</p><div class="setgrid"><strong>Set</strong><strong>${esc(team(m.home))}</strong><strong>${esc(team(m.away))}</strong></div>${Array.from({length:count},(_,i)=>`<div class="setgrid"><span>${i+1}</span><input inputmode="numeric" type="number" min="0" max="99" id="h${i}" value="${sets[i]?.[0]??''}"><input inputmode="numeric" type="number" min="0" max="99" id="a${i}" value="${sets[i]?.[1]??''}"></div>`).join('')}<div class="notice" id="scoreError" style="display:none"></div><div class="actions"><button class="btn primary" id="confirmResult">Review Score</button><button class="btn ghost" id="cancelResult">Cancel</button></div></div>`;document.body.appendChild(dom);const close=()=>dom.remove();$('cancelResult').onclick=close;$('confirmResult').onclick=()=>{let values=[],gap=false;for(let i=0;i<count;i++){let h=$('h'+i).value,a=$('a'+i).value;if(h===''&&a===''){gap=true;continue}if(gap||h===''||a===''){show('Enter consecutive completed sets only.');return}values.push([Number(h),Number(a)])}let err=validSets(values,m);if(err){show(err);return}let wins=values.filter(x=>x[0]>x[1]).length,los=values.length-wins,winningTeam=wins>los?m.home:m.away;dom.querySelector('.modal').innerHTML=`<h2>Confirm Result</h2><p class="note">${esc(matchLabel(m))}</p><h3>${esc(team(winningTeam))} wins ${Math.max(wins,los)}–${Math.min(wins,los)}</h3><p>${esc(values.map((x,i)=>`Set ${i+1}: ${x.join('–')}`).join(' · '))}</p><p class="note">${refMode?'This submits for approval and does not update standings yet.':'This makes the score official. Corrections are recorded in the audit history.'}</p><div class="actions"><button class="btn primary" id="finalConfirm">${refMode?'Submit Report':'Save Official Score'}</button><button class="btn ghost" id="goBack">Go Back</button></div>`;$('goBack').onclick=()=>{close();scoreModal(id,refMode)};$('finalConfirm').onclick=async()=>{close();if(refMode){let by=reporter;await submitReport({id:uid(),matchId:id,home:m.home,away:m.away,by,sets:values,at:new Date().toISOString(),status:'pending'})}else applyScore(m,values,'Director')}};function show(msg){$('scoreError').style.display='block';$('scoreError').textContent=msg}}
function applyScore(m,sets,by){const prior=copy(m.sets||[]);if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool result edits after generating the bracket could invalidate seeds. Export backup, then resolve bracket manually. This edit is blocked for safety.');return}if(m.stage==='playoff'&&m.round!==undefined){let downstream=S.matches.filter(x=>x.stage==='playoff'&&x.round>m.round&&isDone(x));if(downstream.length){alert('Correction blocked: downstream playoff results already exist. Export a backup and resolve the bracket with the tournament director before changing this score.');return}}m.sets=copy(sets);m.forfeitWinner=null;advanceBracket();audit(prior.length?'Score corrected':'Score approved',by,`${team(m.home)} vs ${team(m.away)}; before ${JSON.stringify(prior)}; after ${JSON.stringify(sets)}`);local()}
async function submitReport(r){if(liveMode){if(!client||(courtSecret&&!courtValid)||(!courtSecret&&!refSecret)){alert('Open a valid court or referee QR link to send a score.');return}const {data,error}=courtSecret?await client.rpc('hq_court_submit',{p_secret:courtSecret,p_court:courtIndex,p_match:r.matchId,p_reporter:r.by,p_sets:r.sets,p_home:r.home,p_away:r.away}):await client.rpc('hq_submit',{p_secret:refSecret,p_match:r.matchId,p_sets:r.sets,p_home:r.home,p_away:r.away});if(error){note('NOT sent: '+error.message);return}note('Score received by cloud. Awaiting director approval. Receipt: '+data);return}S.reports.push(r);local();note('Practice score saved on this device only.')}
async function approveReport(id,approve){let r=S.reports.find(x=>x.id===id)||pending.find(x=>x.id===id);if(!r)return;if(liveMode&&cloudRole!=='director'&&cloudRole!=='assistant'){alert('Sign in as an authorized score approver.');return}let m=S.matches.find(x=>x.id===(r.matchId||r.match_id));if(approve&&m){const sets=r.sets,error=validSets(sets,m);if(error){alert(error);return}if(!confirm(`Approve ${r.reporter_name||r.by}'s score for ${team(m.home)} vs ${team(m.away)}?`))return;if(m.home!==(r.match_home||r.home)||m.away!==(r.match_away||r.away)){alert('Match participants have changed. Reject the report.');return}if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool correction after playoffs requires director review.');return}}

function forfeitMatch(id){const m=S.matches.find(x=>x.id===id);if(!m||!m.home||!m.away){alert('Both opponents must be known first.');return}if(isDone(m)){alert('This match already has a final result. Use the controlled correction process.');return}if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Cannot forfeit a pool match after the bracket is generated.');return}if(m.stage==='playoff'&&S.matches.some(x=>x.stage==='playoff'&&x.round>m.round&&isDone(x))){alert('Later playoff results exist. Forfeit blocked.');return}let loser=prompt('Enter the EXACT team name forfeiting this match:\n'+team(m.home)+' or '+team(m.away));if(loser===null)return;loser=loser.trim();const idLost=[m.home,m.away].find(id=>team(id)===loser);if(!idLost){alert('Team name did not match. No result changed.');return}const idWon=idLost===m.home?m.away:m.home;if(!confirm(`${team(idLost)} forfeits to ${team(idWon)}. This awards a match win but no fabricated set or point scores. Continue?`))return;m.forfeitWinner=idWon;m.sets=[];m.status='final';advanceBracket();audit('Match forfeit','Director',`${team(idLost)} forfeited to ${team(idWon)} — ${matchLabel(m)}`);local()}

function saveSetup(){

 for(const [id,low,high,label] of [['count',4,12,'Teams (4–12)'],['courts',1,8,'Courts (1–8)'],['minutes',10,180,'Pool match minutes (10–180)'],['rest',0,120,'Rest minutes (0–120)'],['poolTarget',5,30,'Pool set target (5–30)'],['playoffTarget',5,30,'Playoff set target (5–30)'],['playoffDecider',5,30,'Playoff deciding set (5–30)'],['playoffMinutes',15,120,'Playoff match minutes (15–120)'],['poolCap',0,40,'Pool cap (0–40)'],['playoffCap',0,40,'Playoff cap (0–40)']]){

}

async function pullCloud(force){if(!client)return;if((dirty||cloudWriteInFlight)&&!force){sync='Local changes awaiting cloud save; do not overwrite';return}try{const {data,error}=await client.rpc('hq_view');if(error)throw error;if(data?.data?.schema===2){if(dirty&&!force)return;S=data.data;S.version=Number(data.version||0);cloudRole=data.role||'viewer';localStorage.setItem(KEY,JSON.stringify(S));dirty=false;lastSyncAt=Date.now();sync='Live cloud synced · version '+S.version;render()}else{const roleResp=await client.rpc('hq_my_role');cloudRole=roleResp.data||'viewer';sync='No published cloud tournament. Authorized director can publish practice data.';render()}}catch(e){sync='Cloud sync error: '+e.message;render()}}
async function pushCloud(force=false){
 if(!client||!session||cloudRole!=='director'){note('Only an authorized director can publish');return false}
 if(cloudWriteInFlight){cloudWriteAgain=true;return false}
 if(!dirty&&!force)return true;
 cloudWriteInFlight=true;
 let ok=true;
 try{
  do{
   cloudWriteAgain=false;
   const snapshot=copy(S),revisionAtStart=S.revision;
   const {data,error}=await client.rpc('hq_save',{p_data:snapshot,p_expected:snapshot.version||0});
   if(error)throw error;
   S.version=data;
   const newEdits=S.revision!==revisionAtStart;
   dirty=newEdits;
   localStorage.setItem(KEY,JSON.stringify(S));
   lastSyncAt=Date.now();sync=newEdits?'Cloud saved earlier changes; newer edits pending':'Cloud saved · version '+data;
   if(newEdits)cloudWriteAgain=true;
  }while(cloudWriteAgain);
  render();
 }catch(e){ok=false;sync='NOT saved: '+e.message+'. Export backup before reloading.';render()}
 finally{cloudWriteInFlight=false}
 return ok;
}

// Use capture so an error elsewhere in the page's bindings cannot make print buttons inert.
document.addEventListener('click',function printActions(e){
 const b=e.target.closest('[data-print],[data-doc],[data-courtprint],#testPrintControls');
 if(!b)return;
 if(b.disabled)return;
 e.preventDefault();e.stopImmediatePropagation();
 const status=document.getElementById('printDiagStatus');
 const show=(msg,bad=false)=>{if(status){status.textContent=msg;status.className='notice'+(bad?' bad':' good')}else alert(msg)};
 try{
  if(b.id==='testPrintControls'){
   show('Buttons are receiving clicks. Testing document generator…');
   const content=docSections('master');
   if(!content||!content.includes('SOVEREIGN SPORTS'))throw Error('Master schedule generator returned no document');
   show('Click handlers and document generation work. Try Print / Save PDF for Master Schedule.');
   return;
  }
  if(b.dataset.print){show('Opening '+b.dataset.print+' preview…');printDoc(b.dataset.print);return;}
  if(b.dataset.doc){show('Preparing '+b.dataset.doc+' download…');docDownload(b.dataset.doc);return;}
  if(b.dataset.courtprint!==undefined){show('Preparing court packet…');printCourt(Number(b.dataset.courtprint));return;}
 }catch(err){show('Print error: '+(err&&err.message||String(err)),true);console.error('Tournament HQ printing failure',err)}
},true);
window.addEventListener('storage',e=>{if(e.key===KEY&&!dirty){S=load();render()}});setInterval(()=>{if(mode==='display'){displaySlide++;render()}},15000);if(cloud&&sessionStorage.getItem('hc-v4-practice-only')!=='1')initCloud();render();
</script></body></html>
