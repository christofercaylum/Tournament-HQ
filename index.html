function jotformId(link){
 try{
  const u=new URL(String(link||'').trim());
  const host=u.hostname.toLowerCase();
  if(u.protocol!=='https:' || !(host==='jotform.com'||host.endsWith('.jotform.com')))return '';
  // Published Jotform links can include a username or /form/ path before the form ID.
  const parts=u.pathname.split('/').filter(Boolean);
  return parts.find(p=>/^\d{10,22}$/.test(p))||'';
 }catch{return ''}
}

function jotformDecision(row){

 const email=(row.email||'').toLowerCase().trim();
 if(email && rosterState.players.some(p=>(p.email||'').toLowerCase().trim()===email))return 'review';
 if(rosterState.players.some(p=>(p.name||'').toLowerCase().trim()===row.name.toLowerCase().trim()))return 'review';
 // Multiple waiver submissions by the same person should not stop all other imports.
 // Keep the earliest occurrence selectable; hold subsequent duplicates for review.
 const position=jfPreview.rows.indexOf(row);

 if(jfPreview.rows.slice(0,Math.max(0,position)).some(previous=>{
  const previousEmail=String(previous.email||'').trim().toLowerCase();

async function resolveRosterImportLink(row,form,submissionId){
 if(form.eventKey!==S.title){alert('This form is connected to "'+form.eventKey+'" but the active tournament is "'+S.title+'". Select the matching event before importing.');return null}
 const norm=s=>String(s||'').trim().replace(/\s+/g,' ').toLowerCase();
 const exact=teamRegState.items.find(x=>x.formId===form.formId&&String(x.submissionId)===String(submissionId)&&x.eventKey===S.title);
 const candidates=teamRegState.items.filter(x=>x.eventKey===S.title&&x.status==='approved'&&x.competitionTeamId&&S.teams.some(t=>t.id===x.competitionTeamId));
 const submitted=String(row.teamName||exact?.teamName||'').trim();
 const teamNames=(S.teams||[]).map(t=>`<option value="${esc(t.id)}" ${norm(t.name)===norm(submitted)?'selected':''}>${esc(t.name)}</option>`).join('');
 const related=candidates.filter(x=>norm(x.teamName)===norm(submitted));
 const suggested=exact?.competitionTeamId&&S.teams.some(t=>t.id===exact.competitionTeamId)?exact.competitionTeamId:(related.length===1?related[0].competitionTeamId:(S.teams.find(t=>norm(t.name)===norm(submitted))?.id||''));
 return await new Promise(resolve=>{
  const d=document.createElement('div');d.className='modalcover';
  const close=value=>{d.remove();resolve(value)};
  d.innerHTML=`<div class="modal"><h2>Resolve roster registration · RC13</h2>
   <p class="note">This Jotform submission isn't linked to an approved Setup team. Match the submission to the correct team before importing players. Nothing will change the competition schedule.</p>
   <div class="tile"><strong>Submitted team:</strong> ${esc(submitted||'No team name found')}<br><span class="mini">${esc(form.eventKey)} · Submission ${esc(String(submissionId))}</span></div>
   <label class="field"><span>Competition team in Setup (confirm manually)</span><select id="riLinkTeam"><option value="">Select a team</option>${teamNames}</select></label>
   <p class="note" id="riLinkMsg">A matching name is only a suggestion. Confirm the team before continuing.</p>
   <div class="actions"><button class="btn primary" id="riLinkSave">Confirm team & continue</button><button class="btn ghost" id="riLinkCancel">Cancel</button></div></div>`;
  document.body.appendChild(d);
  const sel=d.querySelector('#riLinkTeam');sel.value=suggested;
  d.querySelector('#riLinkCancel').onclick=()=>close(null);
  d.querySelector('#riLinkSave').onclick=async()=>{
   const team=S.teams.find(t=>t.id===sel.value);if(!team)return alert('Select the Setup team for this submission.');
   if(norm(team.name)!==norm(submitted)&&!confirm('Jotform says "'+submitted+'", but Setup says "'+team.name+'". Confirm this is the correct team?'))return;
   const other=candidates.filter(x=>x.competitionTeamId===team.id&&x.id!==exact?.id);
   if(other.length&&!confirm('This team already has a confirmed registration from another submission. Reuse that team for this roster import? No registration will be overwritten.'))return;
   const btn=d.querySelector('#riLinkSave');btn.disabled=true;btn.textContent='Confirming…';
   if(exact){
    const updated={...exact,status:'approved',competitionTeamId:team.id};
    const ok=await teamRegSave(teamRegState.items.map(x=>x.id===exact.id?updated:x));
    if(!ok){btn.disabled=false;btn.textContent='Confirm team & continue';return}
    close(updated);return;
   }
   if(other.length){
    // Use a confirmed existing team link for this import only; preserve both submission histories.
    close({...other[0],teamName:submitted||team.name,submissionId:String(submissionId)});return;
   }
   const item={id:uid(),formId:form.formId,submissionId:String(submissionId),eventKey:S.title,teamName:submitted||team.name,captainName:String(row.name||'Unknown captain'),captainEmail:String(row.email||''),captainPhone:String(row.phone||''),status:'approved',competitionTeamId:team.id};
   const collisions=teamRegState.items.filter(x=>x.eventKey===S.title&&norm(x.teamName)===norm(item.teamName));
   if(collisions.length){
    // Avoid creating a duplicate record under database uniqueness rules.
    alert('A registration for this team already exists but is not linked to the selected Setup team. Open Update links on that registration and retry. Nothing has been changed.');
    btn.disabled=false;btn.textContent='Confirm team & continue';return;
   }
   const ok=await teamRegSave([...teamRegState.items,item]);
   if(!ok){btn.disabled=false;btn.textContent='Confirm team & continue';return}
   close(item);
  };
 });
}

  <p class="note">${already?'A matching name already appears on this team. ':''}${matches.length>1?'Several directory profiles have this name—select carefully. ':''}Name-only matches must be confirmed by a Director. New profiles contain a name only; no contact consent or waiver is inferred.</p></div>`
 }).join('');
 d.innerHTML=`<div class="modal"><h2>Reviewed roster import · RC14</h2><p class="note"><strong>${esc(reg.teamName)}</strong> · ${esc(S.title)} · ${esc(selectedTeam.name)} in Setup</p>

 document.body.appendChild(d);d.querySelector('#riCancel').onclick=()=>d.remove();
 d.querySelector('#riSave').onclick=async()=>{
  const nextPlayers=[...rosterState.players], nextAssignments=[...rosterState.assignments];
  const planned=new Set(),chosenNames=new Set();let changes=0,alreadyCount=0;
  for(let i=0;i<entries.length;i++){
   const r=entries[i],choice=d.querySelector(`[data-ri-choice="${i}"]`).value;
   if(choice==='skip')continue;
   const label=String(r.name||'').trim(), key=norm(label);

 };

cal practice tools</h2><p class="note">Only affects data stored on this device. Live tournament cloud data is unchanged.</p><div class="quick-actions"><button class="btn primary" id="practiceStart">▶ Start Practice Tournament</button><button class="btn" id="practiceRef">✎ Try Referee Mode</button><button class="btn ghost" id="practiceReset">Reset Local Practice</button></div></div>`:``}<div class="panel"><h2>Schedule status</h2><p class="note">${errors?'There are '+errors+' critical issue(s) to resolve before publishing.':'No critical scheduling conflicts detected.'} ${issues.length-errors} additional warnings or advisories.</p><button class="btn primary" data-tab="safety">Open Safety Check →</button> <span class="tag">${esc(S.status.toUpperCase())}</span></div>${reportQueue()}<div class="panel"><h2>Up next · automatic court board</h2>${nextUp().map(x=>matchCard(x,{edit:true})).join('')||'<p class="note">Generate a match schedule to get started.</p>'}</div>`}
function roundCompletionPanel(){
 const rounds=[];
 const pool=S.matches.filter(m=>m.stage==='pool'&&m.slot!=='BYE');
 if(pool.length)rounds.push({label:'Pool play',games:pool});
 const playoff=S.matches.filter(m=>m.stage==='playoff'&&m.slot!=='BYE');
 const stages=[...new Set(playoff.map(m=>m.round))].sort((a,b)=>a-b);
 for(const round of stages)rounds.push({label:round===stages[stages.length-1]?'Championship':`Playoff round ${Number(round)+1}`,games:playoff.filter(m=>m.round===round)});
 if(!rounds.length)return '';
 const reports=[...S.reports,...pending].filter(r=>r.status==='pending');
 const pendingMatchIds=new Set(reports.map(r=>String(r.match_id||r.matchId||r.match||'')));
 const cards=rounds.map(({label,games})=>{
  const final=games.filter(isDone).length,total=games.length;
  const waiting=games.filter(m=>!isDone(m)&&(!m.home||!m.away));
  const incomplete=games.filter(m=>!isDone(m)&&m.home&&m.away);
  const pct=total?Math.round(final/total*100):0;
  const clear=final===total;
  return `<div class="tile" style="padding:17px"><div class="row"><strong style="font-size:17px">${esc(label)}</strong><span class="tag">${final} / ${total} finalized</span></div>

  <div class="row"><span class="note">${pct}% complete</span><strong style="color:${clear?'#247047':'#7c571d'}">${clear?'✓ Round complete':incomplete.length+' result'+(incomplete.length===1?'':'s')+' to review'}</strong></div>
  ${incomplete.length?`<details style="margin-top:12px" ${incomplete.length<=3?'open':''}><summary style="font-weight:750">Matches needing attention (${incomplete.length})</summary>${incomplete.map(m=>`<div class="note" style="border-top:1px solid #e2e8f0;padding:9px 0">${esc(team(m.home))} vs ${esc(team(m.away))} · ${esc(matchLabel(m))}${pendingMatchIds.has(String(m.id))?' · Report pending approval':''}</div>`).join('')}</details>`:''}
  ${waiting.length?`<details style="margin-top:9px"><summary class="note">${waiting.length} matchup${waiting.length===1?'':'s'} awaiting confirmed teams</summary>${waiting.map(m=>`<div class="note">${esc(matchLabel(m))}</div>`).join('')}</details>`:''}
  </div>`;
 }).join('');
 return `<div class="panel"><div class="row"><div><h2 style="margin-bottom:5px">Round Progress</h2><p class="note" style="margin-top:0">Approved results and upcoming round readiness</p></div><span class="tag">Read-only</span></div>
 ${reports.length?`<div class="notice"><strong>${reports.length} score report${reports.length===1?'':'s'} awaiting approval.</strong> Review the approval queue before advancing.</div>`:''}
 <div class="grid">${cards}</div><p class="note">This panel never edits scores or bracket participants. Finalized totals reflect completed match results.</p></div>`;
}

function recoveryDependents(match){

 const games=S.matches.filter(x=>x.stage==='playoff'&&x.slot!=='BYE');

async function changeLifecycle(target){
 if(mode!=='director'||(liveMode&&cloudRole!=='director')){alert('Director access required.');return}
 if(target==='draft'){
  if(!['published','live'].includes(S.status)){alert('Schedule is already editable.');return}
  if(S.matches.some(isDone)||S.reports.some(r=>r.status==='pending')||pending.some(r=>r.status==='pending')){
   alert('Schedule regeneration is disabled because completed matches or pending score reports exist. Use Quick Fix for individual changes, or export a backup and contact an administrator for a controlled reset.');return;
  }
  if(!confirm('Reopen schedule editing? This temporarily returns the tournament to Draft. Previously published viewers may see the existing schedule until you publish the revision. Re-publish once all changes pass Safety.'))return;
 }else if(target==='published'){
  if(!S.matches.length||validate().some(x=>x.level==='error')){alert('Generate a schedule and resolve critical Safety errors first.');tab='safety';render();return}
  if(S.status!=='draft'&&S.status!=='validated'){alert('Tournament has already been published.');return}
  if(!confirm(`Publish ${S.matches.length} matches? ${validate().filter(x=>x.level==='warn').length} warnings remain. Public viewers will be able to see the schedule.`))return;
 }else if(target==='live'){
  if(S.status!=='published'){alert('Publish the schedule first.');return}
  if(!confirm('Start tournament operations now?'))return;
 }else if(target==='completed'){
  if(S.status!=='live')return;
  if(!tournamentChampion()){alert('Approve the championship result before finishing the tournament.');return}
  if(S.matches.some(m=>m.stage==='playoff'&&m.slot!=='BYE'&&!isDone(m))){alert('Finalize every playoff match before finishing.');return}
  if(pending.some(r=>r.status==='pending')||S.reports.some(r=>r.status==='pending')){alert('Review all pending score submissions before finishing.');return}
  if(!confirm('Finish tournament and preserve results?'))return;
 }
 const prior=S.status;S.status=target;audit('Stage changed','Director',target);
 if(liveMode){
  if(!client||!session){S.status=prior;alert('Cloud is disconnected. No changes published.');return}
  dirty=true;
  const ok=await pushCloud(true);
  if(!ok){S.status=prior;dirty=true;alert('Cloud publication failed. Status was not advanced. Check Cloud and retry.');return}
  dirty=false;notice=target==='draft'?'Schedule reopened for editing. Generate your revision, check Safety, then publish again.':target==='published'?'Schedule published to cloud. Captain and spectator views can now see it.':target==='live'?'Tournament is live. Open Run Tournament.':'Tournament completed and saved.';
 }else{local();notice='Local practice stage updated; not visible on other devices.'}
 if(target==='live')tab='home';render();
}

function helpForIssue(msg){
if(msg.includes('no assigned referee'))return ['No eligible official was available in that time slot under the current staffing and match schedule.','Open Officials to assign an available referee, change staffing mode, or move the match to a free time slot.','assignments'];
if(msg.includes('no line judges assigned'))return ['No available nonplaying team was assigned to cover the line judging duty.','Check both courts at that time. Assign a free team in Officials, supply separate line judges, or move this match.','assignments'];
if(msg.includes('concurrent matches'))return ['One team is assigned to officiate two overlapping matches.','Reassign one duty to another free team or adjust one match time.','assignments'];
if(msg.includes('minutes between'))return ['The team has less than the requested rest period between matches.','Try moving the later match to a free slot in Quick Fix.','quick'];
if(msg.includes('overlap')||msg.includes('double-booked')||msg.includes('simultaneously'))return ['Two commitments overlap, so both cannot be fulfilled as scheduled.','Use Quick Fix to change a time, court, or referee, then rerun validation.','quick'];
if(msg.includes('end time'))return ['The allotted match time would finish after the configured end of the tournament.','Shorten the format or match duration, extend the event window, or shift a match earlier.','setup'];
return ['This check detected an issue that may require director review.','Review the matches and assignments involved; rerun safety checks after making changes.','matches'];
}

function clockRemaining(){const c=S.clock||{};if(c.running&&c.endsAt)return Math.max(0,c.endsAt-Date.now());return Math.max(0,Number(c.remainingMs??1200000))}
function clockDisplay(){const ms=clockRemaining(),sec=Math.ceil(ms/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function clockPanel(){const c=S.clock||{},ready=S.status==='live';const manage=mode==='director'&&(!liveMode||cloudRole==='director');const breakMode=c.phase==='lunch break';const resume= S.settings.preferredBracketStart||'14:00';return `<div class="panel" style="text-align:center;border:2px solid #f0bd35;background:#132a4b;color:white"><div style="font-weight:800;letter-spacing:1px">TOURNAMENT CLOCK · ${esc((c.phase||'pool').toUpperCase())}</div><div id="hqClock" style="font-size:clamp(54px,9vw,112px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;color:#f0bd35">${clockDisplay()}</div><div style="font-size:14px">${!ready?'Available after tournament activation':c.running?'RUNNING':clockRemaining()===0?'TIME EXPIRED':'PAUSED / READY'} · Director controlled</div>${breakMode?`<p style="color:#f0bd35">Lunch / tournament break · scheduled bracket start ${esc(resume)}</p>`:''}<div class="actions" style="margin-top:12px;justify-content:center"><button class="btn" id="enableClockSound" type="button">🔔 Enable Timer Sound</button></div>${manage?`<div class="actions" style="margin-top:12px;justify-content:center"><button class="btn primary" id="clockToggle" ${ready?'':'disabled'}>${c.running?'Pause':'Start / Resume'}</button><button class="btn" id="clockReset" ${ready?'':'disabled'}>Reset ${c.phase==='bracket'?S.settings.playoffMinutes:S.settings.minutes} min</button><button class="btn" id="clockBreak" ${ready?'':'disabled'}>1-min set break</button><button class="btn" id="clockNext" ${ready?'':'disabled'}>3-min transition</button><button class="btn" id="clockLunch" ${ready?'':'disabled'}>${breakMode?'End Break / Restore Clock':'Start Lunch / Break'}</button><button class="btn" id="clockBracket" ${ready?'':'disabled'}>Bracket clock</button></div>`:''}<p style="font-size:12px;opacity:.8">The clock is advisory. Lunch does not modify published match times. Pause and resume are Director-controlled.</p></div>`}
function setClock(action){if(mode!=='director'||(liveMode&&cloudRole!=='director')||S.status!=='live')return;let c=S.clock||{phase:'pool',remainingMs:Number(S.settings.minutes)*60000,running:false};const rem=clockRemaining();if(action==='lunch'){if(c.phase==='lunch break'){c=c.previousClock||{phase:'pool',remainingMs:Number(S.settings.minutes)*60000,running:false,endsAt:null};c.running=false;c.endsAt=null;}else{const hold={...c,remainingMs:rem,running:false,endsAt:null};c={phase:'lunch break',running:false,remainingMs:Number(S.settings.postPoolBreak??30)*60000,endsAt:null,previousClock:hold};}}else if(action==='toggle'){c.running=!c.running;c.remainingMs=rem;c.endsAt=c.running?Date.now()+rem:null}else if(action==='reset'){c.running=false;c.remainingMs=Number(c.phase==='bracket'?S.settings.playoffMinutes:c.phase==='lunch break'?(S.settings.postPoolBreak??30):S.settings.minutes)*60000;c.endsAt=null}else if(action==='break'){c={phase:'set break',running:false,remainingMs:60000,endsAt:null}}else if(action==='next'){c={phase:'transition',running:false,remainingMs:Number(S.settings.breakMinutes??3)*60000,endsAt:null}}else if(action==='bracket'){c={phase:'bracket',running:false,remainingMs:Number(S.settings.playoffMinutes)*60000,endsAt:null}}S.clock=c;audit('Clock control','Director',action+' · '+clockDisplay());local()}
// Web Audio needs a user gesture on iOS/Safari. Each viewing device must enable sound.
let hqAudio=null, hqSoundEnabled=false, hqLastClockRun=null, hqExpirySignaled=new Set(), hqArmedRuns=new Set();
function enableClockSound(){
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)throw Error('Audio not supported');
  if(!hqAudio)hqAudio=new AudioCtor();
  hqAudio.resume();
  hqSoundEnabled=true;
  const b=$('enableClockSound');if(b)b.textContent='🔊 Sound Enabled';
 }catch(e){alert('This browser could not enable the timer sound: '+e.message)}
}
function beepClockEnd(){
 if(!hqSoundEnabled||!hqAudio)return;
 try{
  hqAudio.resume();
  const base=hqAudio.currentTime+0.02;
  // Three clear short tones to distinguish a completed countdown from an ordinary notification.
  for(let i=0;i<3;i++){
   const osc=hqAudio.createOscillator(),gain=hqAudio.createGain(),t=base+i*.30;
   osc.type='sine';osc.frequency.setValueAtTime(880,t);
   gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.20,t+.02);
   gain.gain.setValueAtTime(.20,t+.18);gain.gain.linearRampToValueAtTime(0,t+.24);
   osc.connect(gain);gain.connect(hqAudio.destination);osc.start(t);osc.stop(t+.25);
  }
 }catch(e){console.warn('Timer sound unavailable',e)}
}
function tickClock(){
 const el=$('hqClock');if(el)el.textContent=clockDisplay();
 const c=S.clock||{},key=c.running&&c.endsAt?String(c.endsAt)+'|'+(c.phase||'pool'):null;
 if(key){
  if(hqLastClockRun!==key){hqLastClockRun=key;}
  if(clockRemaining()>0)hqArmedRuns.add(key);
  if(clockRemaining()===0&&hqArmedRuns.has(key)&&!hqExpirySignaled.has(key)){
   hqExpirySignaled.add(key);beepClockEnd();
  }
 }else{hqLastClockRun=null}
}
setInterval(tickClock,250);

function courtUrl(c,token){const u=new URL(location.origin+location.pathname);u.searchParams.set('mode','referee');u.searchParams.set('court',String(c));if(token)u.searchParams.set('court_token',token);if(cloud?.url&&cloud?.key){u.searchParams.set('sb_url',cloud.url);u.searchParams.set('sb_key',cloud.key)}return u.href}

function publicLink(kind){

 u.search='';u.hash='';u.searchParams.set('mode',kind);
 if(liveMode&&cloud?.url&&cloud?.key){
   // Only Supabase public/publishable client keys are eligible for spectator URLs.
   const k=cloud.key;
   let safe=k.startsWith('sb_publishable_');
   if(!safe){try{const part=k.split('.')[1];const payload=JSON.parse(atob(part.replace(/-/g,'+').replace(/_/g,'/')));safe=payload.role==='anon'}catch{safe=false}}
   if(!safe){alert('The configured Supabase key cannot be verified as a PUBLIC anon/publishable key. Do not print it in a QR. Configure a public key first.');return null}

}

function openPrint(html,qr){

 overlay.append(tools,frame);document.body.appendChild(overlay);

 const doc=frame.contentDocument;doc.open();doc.write(htmlDoc(html));doc.close();

   const script=doc.createElement('script');script.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
   script.onload=()=>{try{new frame.contentWindow.QRCode(qrTarget,{text:qr,width:205,height:205,correctLevel:frame.contentWindow.QRCode.CorrectLevel.M});status.textContent='QR ready · Verify it scans before printing';printButton.disabled=false}catch(e){status.textContent='QR error: '+e.message}};

   doc.head.appendChild(script);
 }
}

function validSets(v,m){const rules=matchRules(m);if(!v.length||v.length>3)return 'Wrong number of sets';let a=0,b=0;for(let si=0;si<v.length;si++){const st=v[si];if(st.length!==2||st.some(x=>!Number.isInteger(x)||x<0||x>99)||st[0]===st[1])return 'Each played set needs two different whole-number scores';const high=Math.max(...st),low=Math.min(...st),target=si===2?rules.decider:rules.target,cap=rules.cap; const timedPoolDecider=m.stage==='pool'&&si===2; if(high<target&&!timedPoolDecider)return 'Set '+(si+1)+' has not reached '+target+' points'; if(cap>0&&high>cap)return 'Set '+(si+1)+' exceeds the '+cap+' point cap';if(high-low<2 && !(cap>0&&high===cap) && !timedPoolDecider)return 'Set '+(si+1)+' must be won by two until the cap';if(st[0]>st[1])a++;else b++;if(a===2||b===2){if(si!==v.length-1)return 'Do not enter sets after the match is won'}}if(Math.max(a,b)!==2)return 'One team must win the required sets';return ''}

async function queueDirectorScore(m,sets){
 if(liveMode){
  if(!client||!session||cloudRole!=='director'){alert('Sign in with the Director account to submit scores.');return false}
  if(cloudBusy||cloudWriteInFlight||dirty){alert('Wait for Cloud to finish saving any earlier changes.');return false}
  try{
   const correction=isDone(m);
   if(correction){if(m.forfeitWinner){alert('Forfeit corrections require manual review.');return false}if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool result corrections after bracket generation require manual review.');return false}if(JSON.stringify(m.sets)===JSON.stringify(sets)){alert('No score changes entered.');return false}const test=copy(m);test.sets=copy(sets);if(winner(test)!==winner(m)){alert('Changing the match winner requires manual bracket reconciliation; no correction submitted.');return false}}
   const {data,error}=await client.rpc(correction?'hq_director_correction_submit':'hq_director_submit',{p_match:m.id,p_sets:sets,p_home:m.home,p_away:m.away});
   if(error)throw error;
   const check=await client.rpc('hq_pending');
   if(check.error){notice='Score SUBMITTED (receipt '+data+'), but approval queue refresh failed: '+check.error.message+'. Refresh Cloud before trying again; do not resubmit.';render();alert(notice);return true;}
   pending=(check.data||[]).map(x=>({...x,by:x.reporter_name,home:x.match_home,away:x.match_away}));
   notice=(correction?'Correction':'Score')+' received by Cloud and awaiting approval. Receipt: '+data;
   render();return true;
  }catch(e){notice='Director submission failed: '+(e.message||String(e));render();alert(notice);return false}
 }
 if(isDone(m)){alert('Final-result corrections require Live Mode and Director authentication.');return false;}
 if(S.reports.some(r=>r.status==='pending'&&r.matchId===m.id)){
  alert('A score is already waiting for approval for this match.');return false;
 }
 S.reports.push({id:uid(),matchId:m.id,home:m.home,away:m.away,by:'Director (local practice)',sets:copy(sets),at:new Date().toISOString(),status:'pending'});
 audit('Director local report submitted','Director',matchLabel(m));local();
 notice='Local practice report queued for approval.';render();return true;
}

  if(!match||match.home!==r.home||match.away!==r.away){alert('Match participants have changed. Review or reject the submission.');return}
  const err=validSets(r.sets,match);if(err){alert(err);return}
  if(match.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool scores cannot be changed after creating playoffs without director reconciliation.');return}

($('quickRef'))$('quickRef').onclick=()=>runQuick('ref');if($('refIdentity'))$('refIdentity').onchange=e=>{selectedRef=e.target.value;localStorage.setItem('hc-v4-ref',selectedRef);e.target.blur();render()};if($('addRef'))$('addRef').onclick=()=>{S.refs.push({id:uid(),name:'Referee '+(S.refs.length+1)});local()};if($('playoffBtn'))$('playoffBtn').onclick=generatePlayoff;if($('runValidation'))$('runValidation').onclick=()=>render();if($('export'))$('export').onclick=()=>dl('harvest-crown-backup-v2.json',JSON.stringify(S,null,2));if($('printSchedule'))$('printSchedule').onclick=()=>window.print();if($('exportCsv'))$('exportCsv').onclick=()=>dl('harvest-crown-schedule.csv',['Stage,Pool,Time,Court,Team A,Team B,Referee,Line Judges,Result',...S.matches.filter(x=>x.slot!=='BYE').map(x=>[x.stage,x.pool,fmt(x.start),S.courts[x.court],team(x.home),team(x.away),official(x.official||''),team(x.lineTeam),scoreText(x)].map(s=>'"'+String(s).replaceAll('"','""')+'"').join(','))].join('\n'),'text/csv');if($('import'))$('import').onclick=()=>$('file').click();if($('file'))$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==2||!Array.isArray(d.teams)||!Array.isArray(d.matches)||!Array.isArray(d.audit))throw Error('Invalid file');if(confirm('Replace all local data with backup?')){S=d;local()}}catch(er){alert(er.message)}};if($('nextSlide'))$('nextSlide').onclick=()=>{displaySlide++;render()};if($('fullscreen'))$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();if($('resetCloudTests'))$('resetCloudTests').onclick=resetCloudTests;if($('disconnectCloud'))$('disconnectCloud').onclick=()=>{if(!confirm('Disconnect this browser from Live Mode? Your Supabase project and cloud records will remain unchanged.'))return;sessionStorage.setItem('hc-v4-practice-only','1');liveMode=false;client=null;session=null;cloudRole='viewer';lastSyncAt=0;sync='Local practice mode';tab='home';mode='director';notice='Local practice unlocked. Cloud data remains unchanged.';render()};if($('connect'))$('connect').onclick=connectCloud;if($('makeLink'))$('makeLink').onclick=makeLink;if($('revokeLink'))$('revokeLink').onclick=revokeLinks;if($('login'))$('login').onclick=async()=>{let email=$('email').value.trim();if(!email||!client)return;const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:'Check your inbox for the sign-in link.')};if($('pull'))$('pull').onclick=()=>pullCloud(true);if($('push'))$('push').onclick=()=>{if(validate().some(x=>x.level==='error')){alert('Fix all critical schedule conflicts before publishing.');return}if(confirm('Publish this validated tournament to the cloud?'))pushCloud(true)};if($('logout'))$('logout').onclick=async()=>{await client.auth.signOut();session=null;cloudRole='viewer';await pullCloud(true)}}
async function sdk(){if(window.supabase?.createClient)return;await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';sc.onload=res;sc.onerror=()=>rej(Error('Supabase library unavailable'));document.head.appendChild(sc)})}
async function connectCloud(){const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co$/.test(url)||!key){alert('Enter a valid Supabase project URL and publishable key');return}cloud={url,key};sessionStorage.removeItem('hc-v4-practice-only');localStorage.setItem(CONFIG,JSON.stringify(cloud));await initCloud()}
async function initCloud(){if(!cloud?.url||!cloud?.key)return;try{await sdk();client=window.supabase.createClient(cloud.url,cloud.key);session=(await client.auth.getSession()).data.session;client.auth.onAuthStateChange((_ev,s)=>{session=s;pullCloud(false)});liveMode=true;sync='Connecting…';await pullCloud(false);if(courtSecret){const {data,error}=await client.rpc('hq_court_identity',{p_secret:courtSecret,p_court:courtIndex});courtValid=!error&&data===true;mode='referee';tab='submit';if(!courtValid)sync='Court QR expired or invalid';}if(refSecret){let {data,error}=await client.rpc('hq_ref_identity',{p_secret:refSecret});if(error||!data){sync='Invalid or revoked referee link';mode='display'}else{cloudRefName=data;let matching=S.refs.find(x=>x.name===data);let teamMatch=S.teams.find(x=>x.name===data);if(matching)selectedRef=matching.id;else if(teamMatch)selectedRef='team:'+teamMatch.id;mode='referee';tab='submit'}}await pollReports();if(tab==='rosters')await rosterLoad();if(tab==='connections'||tab==='registrations'){await connectionLoad();await teamRegLoad();await rosterLoad();}if(!window.hqTimer)window.hqTimer=setInterval(async()=>{if(!dirty)await pullCloud(false);if(mode==='director')await pollReports()},5000);render()}catch(e){sync='Cloud unavailable: '+e.message;liveMode=false;render()}}
async function pullCloud(force){if(!client)return;if((dirty||cloudWriteInFlight)&&!force){sync='Local changes awaiting cloud save; do not overwrite';return}try{const {data,error}=await client.rpc('hq_view');if(error)throw error;if(data?.data?.schema===2){if(dirty&&!force)return;S=data.data;S.version=Number(data.version||0);cloudRole=data.role||'viewer';localStorage.setItem(KEY,JSON.stringify(S));dirty=false;lastSyncAt=Date.now();sync='Live cloud synced · version '+S.version;render()}else{const roleResp=await client.rpc('hq_my_role');cloudRole=roleResp.data||'viewer';sync='No published cloud tournament. Authorized director can publish practice data.';render()}}catch(e){sync='Cloud sync error: '+e.message;render()}}
async function pushCloud(force=false){
 if(!client||!session||cloudRole!=='director'){note('Only an authorized director can publish');return false}
 if(cloudWriteInFlight){cloudWriteAgain=true;return false}
 if(!dirty&&!force)return true;
 cloudWriteInFlight=true;
 let ok=true;
 try{
  do{
   cloudWriteAgain=false;
   const snapshot=copy(S),revisionAtStart=S.revision;
   const {data,error}=await client.rpc('hq_save',{p_data:snapshot,p_expected:snapshot.version||0});
   if(error)throw error;
   S.version=data;
   const newEdits=S.revision!==revisionAtStart;
   dirty=newEdits;
   localStorage.setItem(KEY,JSON.stringify(S));
   lastSyncAt=Date.now();sync=newEdits?'Cloud saved earlier changes; newer edits pending':'Cloud saved · version '+data;
   if(newEdits)cloudWriteAgain=true;
  }while(cloudWriteAgain);
  render();
 }catch(e){ok=false;sync='NOT saved: '+e.message+'. Export backup before reloading.';render();alert('Director changes were NOT saved to cloud: '+e.message+'\nExport a backup before reloading.')}
 finally{cloudWriteInFlight=false}
 return ok;
}
async function pollReports(){if(!client||mode!=='director'||!['director','assistant'].includes(cloudRole))return;const {data,error}=await client.rpc('hq_pending');if(!error){pending=(data||[]).map(x=>({...x,by:x.reporter_name,home:x.match_home,away:x.match_away}));if(tab==='home')render()}}
async function resetCloudTests(){
 if(!liveMode||cloudRole!=='director'||!session||!client){alert('Sign in as Director in Live Mode to reset cloud test results.');return}
 if(dirty||cloudWriteInFlight||cloudBusy){alert('A cloud save or unsaved change is pending. Wait for cloud sync before resetting.');return}
 if(!confirm('RESET TOURNAMENT: This will permanently clear this cloud tournament’s match schedule, results, bracket, score reports, and current competition history. Teams, settings, sponsors and referee names will remain. Existing court QR codes and referee links will be revoked. IMPORTANT: a finished event is NOT archived by this action. Export a JSON backup before proceeding. Continue?'))return;
 const response=prompt('Final confirmation: type RESET TOURNAMENT exactly. This does not create an archive or a separate event:');
 if(response!=='RESET TOURNAMENT'){alert('Reset canceled. Nothing was changed.');return}
 cloudBusy=true;
 try{
  const {error}=await client.rpc('hq_reset_test_results',{p_expected:Number(S.version||0)});
  if(error)throw error;
  pending=[];setupDraft=null;await pullCloud(true);tab='setup';notice='Tournament competition data reset. Settings and teams retained; generate a new schedule and issue new court QR codes.';render();
 }catch(e){alert('Reset did NOT complete: '+e.message+'. Existing data should be checked in Cloud before retrying.');}
 finally{cloudBusy=false}
}
async function makeLink(){if(!client||cloudRole!=='director')return;let name=prompt('Exact referee name (must match Setup > Referees):');if(!name)return;if(!S.refs.some(x=>x.name===name)&&!S.teams.some(x=>x.name===name)){alert('Use an exact referee or team name saved and published in Setup.');return}const {data,error}=await client.rpc('hq_issue_token',{p_name:name});if(error){alert(error.message);return}const url=location.origin+location.pathname+'?mode=referee&ref='+encodeURIComponent(data);prompt('Copy this personal referee link NOW (not retrievable later):',url)}
async function revokeLinks(){let name=prompt('Exact referee name whose links should be disabled:');if(!name)return;if(!confirm('Revoke ALL links for '+name+'?'))return;const {error}=await client.rpc('hq_revoke_token',{p_name:name});alert(error?error.message:'Links revoked. Create a replacement link if needed.')}

// Independent print click handling: doesn't rely on bind() completing.
// Use capture so an error elsewhere in the page's bindings cannot make print buttons inert.
document.addEventListener('click',function printActions(e){
 const b=e.target.closest('[data-print],[data-doc],[data-courtprint],[data-publicqr],#testPrintControls');
 if(!b)return;
 if(b.disabled)return;
 e.preventDefault();e.stopImmediatePropagation();
 const status=document.getElementById('printDiagStatus');
 const show=(msg,bad=false)=>{if(status){status.textContent=msg;status.className='notice'+(bad?' bad':' good')}else alert(msg)};
 try{
  if(b.hasAttribute('data-publicqr')){publicSign(b.getAttribute('data-publicqr'));return;}
  if(b.id==='testPrintControls'){
   show('Buttons are receiving clicks. Testing document generator…');
   const content=docSections('master');
   if(!content||!content.includes('SOVEREIGN SPORTS'))throw Error('Master schedule generator returned no document');
   show('Click handlers and document generation work. Try Print / Save PDF for Master Schedule.');
   return;
  }
  if(b.dataset.print){show('Opening '+b.dataset.print+' preview…');printDoc(b.dataset.print);return;}
  if(b.dataset.doc){show('Preparing '+b.dataset.doc+' download…');docDownload(b.dataset.doc);return;}
  if(b.dataset.courtprint!==undefined){show('Preparing court packet…');printCourt(Number(b.dataset.courtprint));return;}
 }catch(err){show('Print error: '+(err&&err.message||String(err)),true);console.error('Tournament HQ printing failure',err)}
},true);
window.addEventListener('storage',e=>{if(e.key===KEY&&!dirty){S=load();render()}});setInterval(()=>{if(mode==='display'){displaySlide++;render()}},15000);if(cloud&&sessionStorage.getItem('hc-v4-practice-only')!=='1')initCloud();render();
