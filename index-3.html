function defaults(){return {schema:2,title:'Harvest Crown Classic',status:'draft',version:0,settings:{count:6,courts:2,start:'09:00',end:'18:00',minutes:30,breakMinutes:0,rest:0,setsToWin:2,target:21,cap:0,playoff:4,autoPools:true,officialMode:'dedicated',lineMode:'teams'},teams:Array.from({length:6},(_,i)=>({id:'t'+(i+1),name:'Team '+(i+1),pool:''})),courts:['Court 1','Court 2'],refs:[{id:'r1',name:'Referee 1'},{id:'r2',name:'Referee 2'},{id:'r3',name:'Referee 3'}],matches:[],reports:[],audit:[],revision:0}};

function chooseFormat(){const n=S.teams.length;if(n<=5)return [n];const count=n<=8?2:3;return Array.from({length:count},(_,i)=>Math.floor(n/count)+(i<n%count?1:0))}

function autoAssign(){
 const games=S.matches.filter(m=>m.stage==='pool').sort((a,b)=>a.start-b.start||a.court-b.court);

}
function assignmentsPage(){const assignments=S.matches.filter(m=>m.stage==='pool');return `<div class="app-intro"><div class="app-eyebrow">OFFICIATING</div><h1 class="app-heading">Officials & line judges</h1><p class="app-subheading">Automatically assigned; easy to override.</p></div><div class="panel"><p class="note">Assignment mode: ${esc(S.settings.officialMode)} · Line judges: ${esc(S.settings.lineMode)}. Reassigning replaces existing assignments; completed scores remain intact.</p><button class="btn primary" id="autoRefs">↻ Assign Officials Automatically</button></div>${assignments.map(m=>`<div class="panel"><strong>${esc(team(m.home))} vs ${esc(team(m.away))}</strong><div class="note">${esc(matchLabel(m))}</div><div class="note">Ref: <strong>${esc(official(m.official||''))}</strong> · Lines: <strong>${esc(m.lineTeam?team(m.lineTeam):'Unassigned')}</strong></div><button class="btn" data-assign="${m.id}">Change Assignment</button></div>`).join('')}</div>`}

function generate(){if(S.status!=='draft'){alert('Move back to Draft first. Live results cannot be regenerated.');return}if(S.matches.some(isDone)&&!confirm('This replaces the schedule AND clears recorded results. Export a backup first. Continue?'))return;const sizes=chooseFormat(),sorted=copy(S.teams);let j=0;sorted.forEach((t,i)=>{t.pool=String.fromCharCode(65+(i%sizes.length))}); // snake-ish distribute by current team order

function generatePlayoff(){if(!allPoolsDone()){alert('All pool scores must be approved first.');return}if(S.matches.some(m=>m.stage!=='pool')){alert('Playoffs already created.');return}let ids=seeded().slice(0,bracketSize()),pow=2**Math.ceil(Math.log2(ids.length));let slots=Array(pow).fill(null);slots[0]=ids[0];const order=(n)=>n===2?[0,1]:order(n/2).flatMap(x=>[x,n-1-x]);let positions=order(pow);ids.forEach((id,i)=>slots[positions[i]]=id);let rounds=[],current=slots;while(current.length>1){rounds.push(current);current=Array(current.length/2).fill(null)}let base=Math.max(...S.matches.map(m=>m.start+S.settings.minutes+S.settings.breakMinutes),minutes(S.settings.start));let stageCount=rounds.length;let roundStart=base;for(let r=0;r<stageCount;r++){for(let i=0;i<rounds[r].length/2;i++){const home=rounds[r][2*i]||null,away=rounds[r][2*i+1]||null;S.matches.push({id:uid(),stage:'playoff',round:r,index:i,pool:'',home,away,sets:[],court:i%S.settings.courts,start:roundStart+Math.floor(i/S.settings.courts)*(S.settings.minutes+S.settings.breakMinutes),slot:`Round ${r+1}`,official:'',lineTeam:'',status:'scheduled'})}roundStart+=Math.ceil((rounds[r].length/2)/S.settings.courts)*(S.settings.minutes+S.settings.breakMinutes)+S.settings.rest}advanceBracket();local()}
function advanceBracket(){let m=S.matches.filter(x=>x.stage==='playoff');const rounds=[...new Set(m.map(x=>x.round))].sort((a,b)=>a-b);for(let r of rounds){const cur=m.filter(x=>x.round===r).sort((a,b)=>a.index-b.index);for(const game of cur){if(game.home&&!game.away&&r===0){game.autoWinner=game.home}else game.autoWinner=null;let target=m.find(x=>x.round===r+1&&x.index===Math.floor(game.index/2));if(!target)continue;let advance=winner(game)||game.autoWinner||null;let prop=game.index%2===0?'home':'away';if(target[prop]!==advance){target[prop]=advance;target.sets=[]}}}}
function validate(){let issues=[],a=S.matches,step=S.settings.minutes+S.settings.breakMinutes,rest=S.settings.rest;const issue=(level,msg)=>issues.push({level,msg});if(S.teams.length<4||S.teams.length>12)issue('error','Tournament requires 4–12 teams.');if(S.settings.courts<1||S.settings.courts>8)issue('error','Use 1–8 courts.');if(!a.length)issue('warn','Generate a schedule first.');for(let i=0;i<a.length;i++){let x=a[i];if(x.court<0||x.court>=S.settings.courts)issue('error',`${x.slot}: court does not exist.`);if(x.start+S.settings.minutes>minutes(S.settings.end))issue('error',`${matchLabel(x)} exceeds tournament end time.`);if(x.home&&x.away&&x.home===x.away)issue('error',`${matchLabel(x)} pits a team against itself.`);if(x.official?.startsWith('team:')){let t=x.official.slice(5);if(t===x.home||t===x.away)issue('error',`${matchLabel(x)} has a playing team assigned to officiate.`)}if(x.lineTeam&&(x.lineTeam===x.home||x.lineTeam===x.away))issue('error',`${matchLabel(x)} assigns line judging to a playing team.`);for(let j=0;j<i;j++){let y=a[j];if(Math.max(x.start,y.start)>=Math.min(x.start+step,y.start+step))continue;if(x.court===y.court)issue('error',`${matchLabel(x)} and ${matchLabel(y)} overlap on the same court.`);for(let t of [x.home,x.away].filter(Boolean))if(t===y.home||t===y.away)issue('error',`${team(t)} is double-booked in ${matchLabel(x)} and ${matchLabel(y)}.`);for(let t of [x.home,x.away].filter(Boolean)){if(y.official===`team:${t}`||y.lineTeam===t)issue('error',`${team(t)} is playing and officiating simultaneously.`)}for(let t of [y.home,y.away].filter(Boolean)){if(x.official===`team:${t}`||x.lineTeam===t)issue('error',`${team(t)} is playing and officiating simultaneously.`)}if(x.official&&x.official===y.official)issue('error',`One referee assignment overlaps in ${matchLabel(x)} and ${matchLabel(y)}.`);if(x.lineTeam&&x.lineTeam===y.lineTeam)issue('warn',`Line judge team ${team(x.lineTeam)} is assigned to concurrent matches.`)}if(x.stage==='pool'&&!x.official)issue('warn',`${matchLabel(x)} has no assigned referee.`);if(x.stage==='pool'&&S.settings.lineMode!=='none'&&!x.lineTeam)issue('warn',`${matchLabel(x)} has no line judges assigned.`)}let scheduled=a.filter(x=>x.stage==='pool');for(const p of pools()){let ids=S.teams.filter(t=>t.pool===p).map(t=>t.id),expected=ids.length*(ids.length-1)/2,actual=scheduled.filter(m=>m.pool===p).length;if(actual!==expected)issue('error',`Pool ${p}: expected ${expected} matches, found ${actual}.`)}for(const id of S.teams.map(t=>t.id)){let games=scheduled.filter(x=>x.home===id||x.away===id).sort((a,b)=>a.start-b.start);for(let i=1;i<games.length;i++){let gap=games[i].start-games[i-1].start-S.settings.minutes;if(gap<rest)issue('warn',`${team(id)} has ${gap} minutes between ${matchLabel(games[i-1])} and ${matchLabel(games[i])} (requested ${rest}).`)}}return issues}
function matchLabel(m){return `${m.stage==='pool'?'Pool '+m.pool:'Playoff'} / ${fmt(m.start)} / ${S.courts[m.court]||'Court '+(m.court+1)}`}

function render(){document.title=S.title+' · Tournament HQ';const pages={home,assignments:assignmentsPage,quick:quickFixPage,matches:matchesPage,standings:standingsPage,bracket:bracketPage,setup,safety,cloud:cloudPage,submit:reportView,reports:reportHistory,schedule:captainPage,display:displayPage};$('root').innerHTML=header()+`<main class="shell">${liveMode&&mode==='director'&&cloudRole==='viewer'?'<div class="notice bad">Director controls are locked. Sign in with an authorized director account under Cloud & Backups.</div>':''}${liveMode&&lastSyncAt&&Date.now()-lastSyncAt>25000?'<div class="notice bad">Cloud updates delayed — check connection before relying on these results.</div>':''}${notice?`<div class="notice">${esc(notice)}</div>`:''}${liveMode&&mode==='director'&&cloudRole==='viewer'?'<div class="panel"><button class="btn primary" data-tab="cloud">Open Cloud Sign-In</button></div>':liveMode&&mode==='director'&&cloudRole==='assistant'?(tab==='cloud'?cloudPage():`<div class="panel"><h2>Assistant Director</h2><p class="note">Review scores while the director plays. Tournament setup and manual score edits are director-only.</p></div>${reportQueue()}`):(pages[tab]||home)()}</main>`;bind()}
function audit(action,by,detail){S.audit.push({id:uid(),action,by,detail,at:new Date().toISOString()})}
function validSets(v){if(!v.length||v.length>2*S.settings.setsToWin-1)return 'Wrong number of sets';let a=0,b=0;for(let si=0;si<v.length;si++){const st=v[si];if(st.length!==2||st.some(x=>!Number.isInteger(x)||x<0||x>99)||st[0]===st[1])return 'Each played set needs two different whole-number scores';if(st[0]>st[1])a++;else b++;if(a===S.settings.setsToWin||b===S.settings.setsToWin){if(si!==v.length-1)return 'Do not enter sets after the match is won'}}if(Math.max(a,b)!==S.settings.setsToWin)return 'One team must win the required sets';return ''}
function scoreModal(id,refMode=false){const reporter=(liveMode&&refSecret?cloudRefName:document.getElementById('refIdentity')?.value)||S.refs[0]?.name||'Referee';let m=S.matches.find(x=>x.id===id);if(!m||!m.home||!m.away)return;let sets=m.sets||[];const count=2*S.settings.setsToWin-1;let dom=document.createElement('div');dom.className='modalcover';dom.innerHTML=`<div class="modal"><h2>${refMode?'Report':'Edit'} Result</h2><p class="note">${esc(team(m.home))} vs ${esc(team(m.away))} · ${esc(matchLabel(m))}</p><div class="setgrid"><strong>Set</strong><strong>${esc(team(m.home))}</strong><strong>${esc(team(m.away))}</strong></div>${Array.from({length:count},(_,i)=>`<div class="setgrid"><span>${i+1}</span><input inputmode="numeric" type="number" min="0" max="99" id="h${i}" value="${sets[i]?.[0]??''}"><input inputmode="numeric" type="number" min="0" max="99" id="a${i}" value="${sets[i]?.[1]??''}"></div>`).join('')}<div class="notice" id="scoreError" style="display:none"></div><div class="actions"><button class="btn primary" id="confirmResult">Review Score</button><button class="btn ghost" id="cancelResult">Cancel</button></div></div>`;document.body.appendChild(dom);const close=()=>dom.remove();$('cancelResult').onclick=close;$('confirmResult').onclick=()=>{let values=[],gap=false;for(let i=0;i<count;i++){let h=$('h'+i).value,a=$('a'+i).value;if(h===''&&a===''){gap=true;continue}if(gap||h===''||a===''){show('Enter consecutive completed sets only.');return}values.push([Number(h),Number(a)])}let err=validSets(values);if(err){show(err);return}let wins=values.filter(x=>x[0]>x[1]).length,los=values.length-wins,winningTeam=wins>los?m.home:m.away;dom.querySelector('.modal').innerHTML=`<h2>Confirm Result</h2><p class="note">${esc(matchLabel(m))}</p><h3>${esc(team(winningTeam))} wins ${Math.max(wins,los)}–${Math.min(wins,los)}</h3><p>${esc(values.map((x,i)=>`Set ${i+1}: ${x.join('–')}`).join(' · '))}</p><p class="note">${refMode?'This submits for approval and does not update standings yet.':'This makes the score official. Corrections are recorded in the audit history.'}</p><div class="actions"><button class="btn primary" id="finalConfirm">${refMode?'Submit Report':'Save Official Score'}</button><button class="btn ghost" id="goBack">Go Back</button></div>`;$('goBack').onclick=()=>{close();scoreModal(id,refMode)};$('finalConfirm').onclick=async()=>{close();if(refMode){let by=reporter;await submitReport({id:uid(),matchId:id,home:m.home,away:m.away,by,sets:values,at:new Date().toISOString(),status:'pending'})}else applyScore(m,values,'Director')}};function show(msg){$('scoreError').style.display='block';$('scoreError').textContent=msg}}
function applyScore(m,sets,by){const prior=copy(m.sets||[]);if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool result edits after generating the bracket could invalidate seeds. Export backup, then resolve bracket manually. This edit is blocked for safety.');return}if(m.stage==='playoff'&&m.round!==undefined){let downstream=S.matches.filter(x=>x.stage==='playoff'&&x.round>m.round&&isDone(x));if(downstream.length&&!confirm('Changing this result will erase dependent later playoff scores. Continue?'))return;downstream.forEach(x=>x.sets=[])}m.sets=copy(sets);advanceBracket();audit(prior.length?'Score corrected':'Score approved',by,`${team(m.home)} vs ${team(m.away)}; before ${JSON.stringify(prior)}; after ${JSON.stringify(sets)}`);local()}
async function submitReport(r){if(liveMode){if(!client||!refSecret){alert('Open your personal referee link to send a score.');return}const {data,error}=await client.rpc('hq_submit',{p_secret:refSecret,p_match:r.matchId,p_sets:r.sets,p_home:r.home,p_away:r.away});if(error){note('NOT sent: '+error.message);return}note('Score received by cloud. Awaiting director approval. Receipt: '+data);return}S.reports.push(r);local();note('Practice score saved on this device only.')}
async function approveReport(id,approve){let r=S.reports.find(x=>x.id===id)||pending.find(x=>x.id===id);if(!r)return;if(liveMode&&cloudRole!=='director'&&cloudRole!=='assistant'){alert('Sign in as an authorized score approver.');return}let m=S.matches.find(x=>x.id===(r.matchId||r.match_id));if(approve&&m){const sets=r.sets,error=validSets(sets);if(error){alert(error);return}if(!confirm(`Approve ${r.reporter_name||r.by}'s score for ${team(m.home)} vs ${team(m.away)}?`))return;if(m.home!==(r.match_home||r.home)||m.away!==(r.match_away||r.away)){alert('Match participants have changed. Reject the report.');return}if(m.stage==='pool'&&S.matches.some(x=>x.stage==='playoff')){alert('Pool correction after playoffs requires director review.');return}}
if(liveMode){if(!client||cloudBusy)return;cloudBusy=true;try{const draft=copy(S);if(approve&&m){const next=draft.matches.find(x=>x.id===m.id);next.sets=copy(r.sets);next.status='final';if(next.stage==='playoff'){S=draft;advanceBracket();draft.matches=S.matches;S=copy(S)}draft.audit.push({id:uid(),action:'Score approved',by:session?.user?.email||'staff',detail:m.id,at:new Date().toISOString()})}const {data,error}=await client.rpc('hq_decide',{p_report:id,p_approve:approve,p_data:approve?draft:null,p_expected:S.version||0});if(error)throw error;if(approve){S=draft;S.version=data;dirty=false;localStorage.setItem(KEY,JSON.stringify(S))}await pollReports();await pullCloud(true);note(approve?'Score approved and synchronized':'Report rejected')}catch(e){note('Approval NOT completed: '+e.message+' — refresh cloud and retry.')}finally{cloudBusy=false}return}
if(approve&&m){applyScore(m,r.sets,r.by);if(!isDone(m))return}r.status=approve?'approved':'rejected';audit(approve?'Report approved':'Report rejected','Director',r.id);local()}
function assignment(id){const m=S.matches.find(x=>x.id===id);if(!m)return;let d=document.createElement('div');d.className='modalcover';const opts=[['','Unassigned'],...S.refs.map(x=>[x.id,x.name]),...S.teams.map(x=>['team:'+x.id,x.name+' (team duty)'])];d.innerHTML=`<div class="modal"><h2>Assign Officials</h2><p class="note">${esc(matchLabel(m))}</p><label class="field"><span>Referee</span><select id="asRef">${opts.map(([k,n])=>`<option value="${esc(k)}" ${m.official===k?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label class="field"><span>Line judge team</span><select id="asLine">${[['','Unassigned'],...S.teams.map(x=>[x.id,x.name])].map(([k,n])=>`<option value="${esc(k)}" ${m.lineTeam===k?'selected':''}>${esc(n)}</option>`).join('')}</select></label><p class="note">Changing assignments triggers a schedule validation check.</p><div class="actions"><button class="btn primary" id="asSave">Save Assignment</button><button class="btn ghost" id="asCancel">Cancel</button></div></div>`;document.body.appendChild(d);$('asCancel').onclick=()=>d.remove();$('asSave').onclick=()=>{let old=[m.official,m.lineTeam];m.official=$('asRef').value;m.lineTeam=$('asLine').value;let errors=validate().filter(x=>x.level==='error');if(errors.length){[m.official,m.lineTeam]=old;alert('Assignment creates a critical conflict:\n'+errors.map(x=>x.msg).join('\n'));return}audit('Assignment edited','Director',matchLabel(m));d.remove();local()}}
function setStage(st){if(['published','live','completed'].includes(st)&&validate().some(x=>x.level==='error')){alert('Cannot publish a schedule with critical conflicts. Open Safety.');return}if(st==='draft'&&S.status==='live'&&!confirm('Return tournament to Draft? Scores are preserved, but this changes the event state.'))return;S.status=st;audit('Stage changed','Director',st);local()}
function saveSetup(){let n=Number($('count').value),c=Number($('courts').value),mins=Number($('minutes').value),rest=Number($('rest').value),start=$('start').value,end=$('end').value;if(!Number.isInteger(n)||n<4||n>12||!Number.isInteger(c)||c<1||c>8||mins<10||mins>180||rest<0||minutes(end)<=minutes(start)){alert('Please check teams (4–12), courts (1–8), match length, rest and start/end times.');return}let structural=n!==S.teams.length||c!==S.settings.courts||mins!==S.settings.minutes||start!==S.settings.start||rest!==S.settings.rest||Number($('playoff').value)!==S.settings.playoff||Number($('setsToWin').value)!==S.settings.setsToWin;if(structural&&S.matches.length&&S.status!=='draft'){alert('Switch to Draft before changing match structure. Export a backup first.');return}if(structural&&S.matches.some(isDone)){alert('Structural settings cannot change after scores exist. Export a backup and reset the tournament in a separate copy.');return}if(structural&&S.matches.length&&!confirm('Settings changed. Existing generated schedule will be cleared. Proceed?'))return;S.title=$('title').value.trim()||S.title;S.settings={...S.settings,courts:c,start,end,minutes:mins,rest,setsToWin:Number($('setsToWin').value),playoff:Number($('playoff').value)};if(n>S.teams.length)while(S.teams.length<n)S.teams.push({id:uid(),name:'Team '+(S.teams.length+1),pool:''});else S.teams=S.teams.slice(0,n);S.courts=Array.from({length:c},(_,i)=>S.courts[i]||'Court '+(i+1));if(structural){S.matches=[];S.reports=[]}audit('Setup saved','Director',`${n} teams, ${c} courts`);local()}
function dl(name,data,type='application/json'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('modeSelect').onchange=e=>{if(liveMode&&refSecret&&e.target.value!=='referee'){alert('Referee links are for score reporting only');e.target.value='referee';return}mode=e.target.value;let u=new URL(location.href);u.searchParams.set('mode',mode);history.replaceState({},'',u);render()};document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>scoreModal(b.dataset.score));document.querySelectorAll('[data-refscore]').forEach(b=>b.onclick=()=>scoreModal(b.dataset.refscore,true));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assignment(b.dataset.assign));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveReport(b.dataset.approve,true));document.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>approveReport(b.dataset.reject,false));document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(b.dataset.stage));if($('practiceStart'))$('practiceStart').onclick=()=>{if(liveMode){alert('Disconnect from cloud before starting a new practice tournament.');return}if(S.matches.length&&!confirm('Replace current practice data?'))return;S=defaults();generate();tab='matches';notice='Practice schedule created. Enter scores as Director or choose Referee from the top menu, then return Home to approve submissions.';render()};if($('practiceRef'))$('practiceRef').onclick=()=>{mode='referee';tab='submit';render()};if($('practiceReset'))$('practiceReset').onclick=()=>{if(liveMode){alert('Cannot reset while Live Mode is connected.');return}if(!confirm('Erase this practice tournament?'))return;S=defaults();local();tab='home';notice='Practice data reset';render()};if($('toggleDone'))$('toggleDone').onclick=()=>{showCompleted=!showCompleted;render()};if($('saveSetup'))$('saveSetup').onclick=saveSetup;if($('generate'))$('generate').onclick=()=>{if(S.matches.length&&!confirm('Regenerate matches? Existing unsaved assignments and any scores will be replaced.'))return;generate()};if($('saveTeams'))$('saveTeams').onclick=()=>{document.querySelectorAll('[data-team]').forEach(x=>S.teams.find(t=>t.id===x.dataset.team).name=x.value.trim()||'Unnamed Team');audit('Team names updated','Director','');local()};if($('saveCourts'))$('saveCourts').onclick=()=>{document.querySelectorAll('[data-court]').forEach(x=>S.courts[+x.dataset.court]=x.value.trim()||'Court '+(+x.dataset.court+1));local()};if($('saveRefs'))$('saveRefs').onclick=()=>{document.querySelectorAll('[data-ref]').forEach(x=>S.refs.find(r=>r.id===x.dataset.ref).name=x.value.trim()||'Referee');local()};if($('saveOffMode'))$('saveOffMode').onclick=()=>{S.settings.officialMode=$('officialMode').value;S.settings.lineMode=$('lineMode').value;local()};if($('autoRefs'))$('autoRefs').onclick=()=>{if(S.matches.some(isDone)&&!confirm('Reassign remaining officiating duties? Completed-match assignments may change in history.'))return;let out=autoAssign();audit('Officiating assigned','Director',out.unfilled+' unfilled');local()};if($('quickDelay'))$('quickDelay').onclick=()=>runQuick('delay');if($('quickCourt'))$('quickCourt').onclick=()=>runQuick('court');if($('quickRef'))$('quickRef').onclick=()=>runQuick('ref');if($('refIdentity'))$('refIdentity').onchange=e=>{let r=S.refs.find(x=>x.name===e.target.value);if(r){selectedRef=r.id;localStorage.setItem('hc-v4-ref',r.id);render()}};if($('addRef'))$('addRef').onclick=()=>{S.refs.push({id:uid(),name:'Referee '+(S.refs.length+1)});local()};if($('playoffBtn'))$('playoffBtn').onclick=generatePlayoff;if($('runValidation'))$('runValidation').onclick=()=>render();if($('export'))$('export').onclick=()=>dl('harvest-crown-backup-v2.json',JSON.stringify(S,null,2));if($('printSchedule'))$('printSchedule').onclick=()=>window.print();if($('exportCsv'))$('exportCsv').onclick=()=>dl('harvest-crown-schedule.csv',['Stage,Pool,Time,Court,Team A,Team B,Referee,Line Judges,Result',...S.matches.map(x=>[x.stage,x.pool,fmt(x.start),S.courts[x.court],team(x.home),team(x.away),official(x.official||''),team(x.lineTeam),scoreText(x)].map(s=>'"'+String(s).replaceAll('"','""')+'"').join(','))].join('\n'),'text/csv');if($('import'))$('import').onclick=()=>$('file').click();if($('file'))$('file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(d.schema!==2||!Array.isArray(d.teams)||!Array.isArray(d.matches)||!Array.isArray(d.audit))throw Error('Invalid file');if(confirm('Replace all local data with backup?')){S=d;local()}}catch(er){alert(er.message)}};if($('nextSlide'))$('nextSlide').onclick=()=>{displaySlide++;render()};if($('fullscreen'))$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();if($('connect'))$('connect').onclick=connectCloud;if($('makeLink'))$('makeLink').onclick=makeLink;if($('revokeLink'))$('revokeLink').onclick=revokeLinks;if($('login'))$('login').onclick=async()=>{let email=$('email').value.trim();if(!email||!client)return;const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});alert(error?error.message:'Check your inbox for the sign-in link.')};if($('pull'))$('pull').onclick=()=>pullCloud(true);if($('push'))$('push').onclick=()=>{if(validate().some(x=>x.level==='error')){alert('Fix all critical schedule conflicts before publishing.');return}if(confirm('Publish this validated tournament to the cloud?'))pushCloud(true)};if($('logout'))$('logout').onclick=async()=>{await client.auth.signOut();session=null;cloudRole='viewer';await pullCloud(true)}}
async function sdk(){if(window.supabase?.createClient)return;await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';sc.onload=res;sc.onerror=()=>rej(Error('Supabase library unavailable'));document.head.appendChild(sc)})}
async function connectCloud(){const url=$('url').value.trim(),key=$('key').value.trim();if(!/^https:\/\/[\w-]+\.supabase\.co$/.test(url)||!key){alert('Enter a valid Supabase project URL and publishable key');return}cloud={url,key};localStorage.setItem(CONFIG,JSON.stringify(cloud));await initCloud()}
async function initCloud(){if(!cloud?.url||!cloud?.key)return;try{await sdk();client=window.supabase.createClient(cloud.url,cloud.key);session=(await client.auth.getSession()).data.session;client.auth.onAuthStateChange((_ev,s)=>{session=s;pullCloud(false)});liveMode=true;sync='Connecting…';await pullCloud(false);if(refSecret){let {data,error}=await client.rpc('hq_ref_identity',{p_secret:refSecret});if(error||!data){sync='Invalid or revoked referee link';mode='display'}else{cloudRefName=data;let matching=S.refs.find(x=>x.name===data);let teamMatch=S.teams.find(x=>x.name===data);if(matching)selectedRef=matching.id;else if(teamMatch)selectedRef='team:'+teamMatch.id;mode='referee';tab='submit'}}await pollReports();if(!window.hqTimer)window.hqTimer=setInterval(async()=>{if(!dirty)await pullCloud(false);if(mode==='director')await pollReports()},5000);render()}catch(e){sync='Cloud unavailable: '+e.message;liveMode=false;render()}}
async function pullCloud(force){if(!client)return;if(dirty&&!force){sync='Local changes awaiting cloud save; do not overwrite';return}try{const {data,error}=await client.rpc('hq_view');if(error)throw error;if(data?.data?.schema===2){if(dirty&&!force)return;S=data.data;S.version=Number(data.version||0);cloudRole=data.role||'viewer';localStorage.setItem(KEY,JSON.stringify(S));dirty=false;lastSyncAt=Date.now();sync='Live cloud synced · version '+S.version;render()}else{const roleResp=await client.rpc('hq_my_role');cloudRole=roleResp.data||'viewer';sync='No published cloud tournament. Authorized director can publish practice data.';render()}}catch(e){sync='Cloud sync error: '+e.message;render()}}
async function pushCloud(force=false){if(!client||!session||cloudRole!=='director'){note('Only an authorized director can publish');return}if(!dirty&&!force)return;try{let {data,error}=await client.rpc('hq_save',{p_data:S,p_expected:S.version||0});if(error)throw error;S.version=data;localStorage.setItem(KEY,JSON.stringify(S));dirty=false;lastSyncAt=Date.now();sync='Cloud saved · version '+data;render()}catch(e){sync='NOT saved: '+e.message+'. Export backup before reloading.';render()}}
async function pollReports(){if(!client||mode!=='director'||!['director','assistant'].includes(cloudRole))return;const {data,error}=await client.rpc('hq_pending');if(!error){pending=(data||[]).map(x=>({...x,by:x.reporter_name,home:x.match_home,away:x.match_away}));if(tab==='home')render()}}
async function makeLink(){if(!client||cloudRole!=='director')return;let name=prompt('Exact referee name (must match Setup > Referees):');if(!name)return;if(!S.refs.some(x=>x.name===name)&&!S.teams.some(x=>x.name===name)){alert('Use an exact referee or team name saved and published in Setup.');return}const {data,error}=await client.rpc('hq_issue_token',{p_name:name});if(error){alert(error.message);return}const url=location.origin+location.pathname+'?mode=referee&ref='+encodeURIComponent(data);prompt('Copy this personal referee link NOW (not retrievable later):',url)}
async function revokeLinks(){let name=prompt('Exact referee name whose links should be disabled:');if(!name)return;if(!confirm('Revoke ALL links for '+name+'?'))return;const {error}=await client.rpc('hq_revoke_token',{p_name:name});alert(error?error.message:'Links revoked. Create a replacement link if needed.')}
window.addEventListener('storage',e=>{if(e.key===KEY&&!dirty){S=load();render()}});setInterval(()=>{if(mode==='display'){displaySlide++;render()}},15000);if(cloud)initCloud();render();
</script></body></html>
